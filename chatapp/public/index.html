<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatApp — Socket.IO</title>
<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { height:100vh; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); display:flex; align-items:center; justify-content:center; }

  /* ---------- login screen ---------- */
  #loginScreen { background:rgba(255,255,255,0.06); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.15);
    padding:40px; border-radius:16px; text-align:center; width:340px; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  #loginScreen h1 { color:#fff; margin-bottom:6px; font-size:26px; }
  #loginScreen p { color:#9fb3c8; font-size:14px; margin-bottom:24px; }
  #loginScreen input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08); color:#fff; font-size:15px; outline:none; margin-bottom:14px; }
  #loginScreen input:focus { border-color:#4fc3f7; }
  #loginScreen button { width:100%; padding:12px; border:none; border-radius:10px; background:#4fc3f7; color:#06283d;
    font-size:16px; font-weight:600; cursor:pointer; transition:0.2s; }
  #loginScreen button:hover { background:#81d4fa; }

  /* ---------- chat layout ---------- */
  #chatApp { display:none; width:95%; max-width:1100px; height:90vh; background:rgba(255,255,255,0.05);
    backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.12); border-radius:18px; overflow:hidden;
    display:none; grid-template-columns:260px 1fr; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  #chatApp.active { display:grid; }

  /* sidebar */
  #sidebar { border-right:1px solid rgba(255,255,255,0.1); padding:18px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
  .sideTitle { color:#4fc3f7; font-size:12px; letter-spacing:2px; text-transform:uppercase; }
  .badge { display:inline-block; background:rgba(79,195,247,0.15); color:#4fc3f7; border-radius:20px;
    padding:3px 12px; font-size:13px; }
  #roomList button { display:block; width:100%; text-align:left; margin:4px 0; padding:8px 10px; border:none; border-radius:8px;
    background:transparent; color:#cfd8dc; cursor:pointer; font-size:14px; transition:0.15s; }
  #roomList button:hover { background:rgba(255,255,255,0.08); }
  #roomList button.current { background:rgba(79,195,247,0.2); color:#4fc3f7; font-weight:600; }
  .roomRow { display:flex; gap:6px; }
  .roomRow input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.07); color:#fff; font-size:13px; outline:none; }
  .roomRow button { padding:8px 12px; border:none; border-radius:8px; background:#4fc3f7; color:#06283d; font-weight:700; cursor:pointer; }
  #userList div { color:#b0bec5; font-size:14px; padding:4px 6px; }
  #userList div::before { content:"● "; color:#69f0ae; font-size:10px; }

  /* main chat */
  #main { display:flex; flex-direction:column; }
  #chatHeader { padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; gap:12px; }
  #chatHeader h2 { color:#fff; font-size:18px; flex:1; }
  #messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:65%; padding:10px 14px; border-radius:14px; color:#eceff1; font-size:14.5px; line-height:1.4; animation:pop 0.2s ease; }
  @keyframes pop { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .msg .meta { display:block; font-size:11px; opacity:0.7; margin-bottom:3px; }
  .msg.mine { align-self:flex-end; background:linear-gradient(135deg,#0288d1,#4fc3f7); color:#fff; border-bottom-right-radius:4px; }
  .msg.theirs { align-self:flex-start; background:rgba(255,255,255,0.1); border-bottom-left-radius:4px; }
  .sys { align-self:center; color:#8fa3b0; font-size:12.5px; background:rgba(255,255,255,0.06); padding:5px 14px; border-radius:20px; }
  #typing { padding:0 20px 4px; color:#81d4fa; font-size:13px; min-height:20px; font-style:italic; }
  #inputBar { display:flex; gap:10px; padding:14px 18px; border-top:1px solid rgba(255,255,255,0.1); }
  #inputBar input { flex:1; padding:12px 16px; border-radius:24px; border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08); color:#fff; font-size:15px; outline:none; }
  #inputBar input:focus { border-color:#4fc3f7; }
  #inputBar button { padding:12px 24px; border:none; border-radius:24px; background:#4fc3f7; color:#06283d;
    font-size:15px; font-weight:700; cursor:pointer; transition:0.2s; }
  #inputBar button:hover { background:#81d4fa; }

  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:3px; }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <h1>💬 ChatApp</h1>
    <p>Socket.IO real-time chat — pick a name to enter</p>
    <input id="nameInput" placeholder="Your name..." maxlength="20" />
    <button onclick="joinChat()">Join Chat</button>
  </div>

  <!-- CHAT -->
  <div id="chatApp">
    <div id="sidebar">
      <div>
        <div class="sideTitle">Status</div>
        <span class="badge" id="activeCount">🟢 0 online</span>
      </div>
      <div>
        <div class="sideTitle">Rooms</div>
        <div id="roomList"></div>
        <div class="roomRow">
          <input id="newRoom" placeholder="New room name..." maxlength="30" />
          <button onclick="createRoom()">＋</button>
        </div>
        <button id="leaveBtn" style="display:none; margin-top:6px; padding:6px 10px; border:none; border-radius:8px;
          background:rgba(255,82,82,0.2); color:#ff8a80; cursor:pointer; font-size:13px;" onclick="leaveRoom()">← Leave room</button>
      </div>
      <div>
        <div class="sideTitle">Online users</div>
        <div id="userList"></div>
      </div>
    </div>

    <div id="main">
      <div id="chatHeader">
        <h2 id="roomTitle">Public Room</h2>
        <span class="badge" id="myName"></span>
      </div>
      <div id="messages"></div>
      <div id="typing"></div>
      <div id="inputBar">
        <input id="msgInput" placeholder="Type a message..." maxlength="500" oninput="sendTyping()" />
        <button onclick="sendMsg()">Send</button>
      </div>
    </div>
  </div>

<script>
  const socket = io("ws://" + location.hostname + ":8081", { transports: ["websocket"] });

  let myName = null;
  let currentRoom = "Public Room";

  /* ---------- original events (kept from class demo) ---------- */
  socket.on("gyankibaat", (msg) => console.log("Message from server", msg));
  socket.on("join",       (msg) => console.log("Message from server", msg));
  socket.on("announcement",(msg) => console.log("Message from server", msg));

  /* ---------- UI helpers ---------- */
  const $ = (id) => document.getElementById(id);

  function addMsg(cls, html) {
    const d = document.createElement("div");
    d.className = cls;
    d.innerHTML = html;
    $("messages").appendChild(d);
    $("messages").scrollTop = $("messages").scrollHeight;
  }
  const addSystem = (text) => addMsg("sys", text);

  /* ---------- login ---------- */
  function joinChat() {
    myName = $("nameInput").value.trim();
    if (!myName) { alert("Please enter your name"); return; }
    socket.emit("set-name", myName);
    socket.emit("kuchbhi", "welcome to client side");   // original event kept
    $("loginScreen").style.display = "none";
    $("chatApp").classList.add("active");
    $("myName").textContent = myName;
    addSystem("Welcome, " + myName + " 👋");
  }
  $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") joinChat(); });

  /* ---------- sending ---------- */
  function sendMsg() {
    const text = $("msgInput").value.trim();
    if (!text) return;
    socket.emit("chat-message", { text, room: currentRoom });
    $("msgInput").value = "";
    $("typing").textContent = "";
  }
  $("msgInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });

  let typingTimer;
  function sendTyping() {
    socket.emit("typing", currentRoom);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => $("typing").textContent = "", 1500);
  }

  /* ---------- rooms ---------- */
  function createRoom() {
    const name = $("newRoom").value.trim();
    if (!name) return;
    socket.emit("create-room", name);
    $("newRoom").value = "";
  }
  function joinRoom(name) { socket.emit("join-room", name); }
  function leaveRoom()    { socket.emit("leave-room"); }

  /* ---------- receiving ---------- */
  socket.on("chat-message", (m) => {
    if (m.room !== currentRoom) return;
    const cls = m.user === myName ? "msg mine" : "msg theirs";
    addMsg(cls, `<span class="meta">${m.user} · ${m.time}</span>${m.text}`);
  });

  socket.on("system", addSystem);

  socket.on("typing", (user) => {
    if (user !== myName) $("typing").textContent = user + " is typing...";
  });

  socket.on("active-users", (n) => $("activeCount").textContent = "🟢 " + n + " online");

  socket.on("user-list", (names) => {
    $("userList").innerHTML = names.map((n) => "<div>" + n + "</div>").join("");
  });

  socket.on("room-list", (rooms) => {
    $("roomList").innerHTML = rooms.map((r) =>
      `<button class="${r === currentRoom ? "current" : ""}" onclick="joinRoom('${r.replace(/'/g, "\'")}')">
        ${r === "Public Room" ? "🌐 " : "🔒 "}${r}</button>`).join("");
  });

  socket.on("room-changed", (room) => {
    currentRoom = room;
    $("roomTitle").textContent = room;
    $("messages").innerHTML = "";
    $("leaveBtn").style.display = room === "Public Room" ? "none" : "inline-block";
    addSystem("You are now in " + room);
  });
</script>
</body>
</html>
