<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortLink – Code Walkthrough Video Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --card: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --accent: #38bdf8;
      --success: #10b981;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }
    .btn:hover { background: #27272a; }
    .btn-primary { background: var(--accent); color: #09090b; border-color: var(--accent); font-weight: 600; }
    .btn-primary:hover { background: #7dd3fc; }
    .speed-select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      outline: none;
    }
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px - 8px);
      overflow: hidden;
    }
    .sidebar {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .category-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-weight: 700;
    }
    .file-pill {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.12s;
    }
    .file-pill:hover { background: var(--card); color: var(--text); }
    .file-pill.active {
      background: var(--card);
      border-color: var(--border);
      color: var(--accent);
      font-weight: 600;
    }
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d0d11;
      overflow: hidden;
      position: relative;
    }
    .file-header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8125rem;
      flex-shrink: 0;
    }
    .code-scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      position: relative;
    }
    pre {
      margin: 0 !important;
      background: transparent !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.875rem !important;
      line-height: 1.6 !important;
    }
    .progress-bar {
      height: 4px;
      background: var(--border);
      width: 100%;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s linear;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <strong style="font-size: 1.05rem;">ShortLink</strong>
      <span class="badge">Code Walkthrough Player</span>

  </header>

    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>

  <script>
    const files = [{"path":"server/server.js","name":"server.js","category":"Backend (MVC Architecture)","ext":"js","code":"const express = require('express');\r\nconst cors = require('cors');\r\nconst dotenv = require('dotenv');\r\nconst connectDB = require('./config/db');\r\nconst { notFoundHandler, errorHandler } = require('./middleware/errorMiddleware');\r\n\r\ndotenv.config();\r\n\r\nconnectDB();\r\n\r\nconst app = express();\r\n\r\napp.use(\r\n  cors({\r\n    origin: '*',\r\n    methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS'],\r\n    allowedHeaders: ['Content-Type', 'Authorization'],\r\n  })\r\n);\r\n\r\napp.use(express.json());\r\napp.use(express.urlencoded({ extended: true }));\r\n\r\napp.get('/health', (req, res) => {\r\n  res.status(200).json({\r\n    status: 'online',\r\n    service: 'ShortLink API (Bitly Clone)',\r\n    timestamp: new Date().toISOString(),\r\n  });\r\n});\r\n\r\napp.use('/api/auth', require('./routes/authRoutes'));\r\napp.use('/api/links', require('./routes/linkRoutes'));\r\napp.use('/api/admin', require('./routes/adminRoutes'));\r\n\r\napp.use('/', require('./routes/redirectRoutes'));\r\n\r\napp.use(notFoundHandler);\r\napp.use(errorHandler);\r\n\r\nconst PORT = process.env.PORT || 5000;\r\n\r\nconst server = app.listen(PORT, () => {\r\n  console.log(`====================================================`);\r\n  console.log(`  ShortLink Backend MVC Server Running on port ${PORT}`);\r\n  console.log(`  Environment: ${process.env.NODE_ENV || 'development'}`);\r\n  console.log(`  Base URL:    ${process.env.BASE_URL || `http://localhost:${PORT}`}`);\r\n  console.log(`====================================================`);\r\n});\r\n\r\nprocess.on('unhandledRejection', (err) => {\r\n  console.error(`[Unhandled Rejection] ${err.message}`);\r\n});\r\n\r\nmodule.exports = app;\r\n","lines":56},{"path":"server/config/db.js","name":"db.js","category":"Backend (MVC Architecture)","ext":"js","code":"const mongoose = require('mongoose');\n\nconst connectDB = async () => {\n  const uri = process.env.MONGO_URI || 'mongodb://127.0.0.1:27017/shortlink_db';\n  try {\n    const conn = await mongoose.connect(uri, {\n      serverSelectionTimeoutMS: 5000,\n    });\n    console.log(`[Database] MongoDB Connected successfully: ${conn.connection.host}/${conn.connection.name}`);\n  } catch (error) {\n    console.error(`[Database Error] Connection failed: ${error.message}`);\n    console.log('[Database Tip] Check if MongoDB is running locally, or update MONGO_URI in server/.env with your MongoDB Atlas cluster URI.');\n  }\n};\n\nmodule.exports = connectDB;\n","lines":17},{"path":"server/models/User.js","name":"User.js","category":"Backend (MVC Architecture)","ext":"js","code":"const mongoose = require('mongoose');\r\nconst bcrypt = require('bcryptjs');\r\n\r\nconst userSchema = new mongoose.Schema(\r\n  {\r\n    name: {\r\n      type: String,\r\n      required: [true, 'Please provide a name'],\r\n      trim: true,\r\n      maxlength: [50, 'Name cannot exceed 50 characters'],\r\n    },\r\n    email: {\r\n      type: String,\r\n      required: [true, 'Please provide an email address'],\r\n      unique: true,\r\n      trim: true,\r\n      lowercase: true,\r\n      match: [\r\n        /^\\w+([.-]?\\w+)*@\\w+([.-]?\\w+)*(\\.\\w{2,3})+$/,\r\n        'Please provide a valid email address',\r\n      ],\r\n    },\r\n    password: {\r\n      type: String,\r\n      required: [true, 'Please provide a password'],\r\n      minlength: [6, 'Password must be at least 6 characters'],\r\n    },\r\n    role: {\r\n      type: String,\r\n      enum: {\r\n        values: ['user', 'admin'],\r\n        message: '{VALUE} is not a valid role',\r\n      },\r\n      default: 'user',\r\n    },\r\n    refreshToken: {\r\n      type: String,\r\n      default: null,\r\n    },\r\n  },\r\n  {\r\n    timestamps: true,\r\n  }\r\n);\r\n\r\nuserSchema.pre('save', async function (next) {\r\n  if (!this.isModified('password')) {\r\n    return next();\r\n  }\r\n  const salt = await bcrypt.genSalt(10);\r\n  this.password = await bcrypt.hash(this.password, salt);\r\n  next();\r\n});\r\n\r\nuserSchema.methods.matchPassword = async function (enteredPassword) {\r\n  return await bcrypt.compare(enteredPassword, this.password);\r\n};\r\n\r\nuserSchema.methods.toJSON = function () {\r\n  const userObject = this.toObject();\r\n  delete userObject.password;\r\n  delete userObject.refreshToken;\r\n  return userObject;\r\n};\r\n\r\nmodule.exports = mongoose.model('User', userSchema);\r\n","lines":67},{"path":"server/models/Link.js","name":"Link.js","category":"Backend (MVC Architecture)","ext":"js","code":"const mongoose = require('mongoose');\r\n\r\nconst linkSchema = new mongoose.Schema(\r\n  {\r\n    originalUrl: {\r\n      type: String,\r\n      required: [true, 'Original URL is required'],\r\n      trim: true,\r\n      match: [\r\n        /^(https?:\\/\\/)([\\da-z.-]+)\\.([a-z.]{2,6})([/\\w .-]*)*\\/?(\\?.*)?(#.*)?$/i,\r\n        'Please enter a valid URL starting with http:// or https://',\r\n      ],\r\n    },\r\n    shortCode: {\r\n      type: String,\r\n      required: true,\r\n      unique: true,\r\n      trim: true,\r\n      index: true,\r\n    },\r\n    alias: {\r\n      type: String,\r\n      trim: true,\r\n      default: null,\r\n      sparse: true,\r\n    },\r\n    createdBy: {\r\n      type: mongoose.Schema.Types.ObjectId,\r\n      ref: 'User',\r\n      required: [true, 'Creator user ID is required'],\r\n      index: true,\r\n    },\r\n    clicksCount: {\r\n      type: Number,\r\n      default: 0,\r\n      min: 0,\r\n    },\r\n    isBlocked: {\r\n      type: Boolean,\r\n      default: false,\r\n    },\r\n    blockReason: {\r\n      type: String,\r\n      default: '',\r\n      trim: true,\r\n    },\r\n    expiresAt: {\r\n      type: Date,\r\n      default: null,\r\n    },\r\n  },\r\n  {\r\n    timestamps: true,\r\n  }\r\n);\r\n\r\nlinkSchema.index({ createdBy: 1, createdAt: -1 });\r\n\r\nlinkSchema.methods.isExpired = function () {\r\n  if (!this.expiresAt) return false;\r\n  return new Date() > new Date(this.expiresAt);\r\n};\r\n\r\nmodule.exports = mongoose.model('Link', linkSchema);\r\n","lines":65},{"path":"server/models/Click.js","name":"Click.js","category":"Backend (MVC Architecture)","ext":"js","code":"const mongoose = require('mongoose');\r\n\r\nconst clickSchema = new mongoose.Schema(\r\n  {\r\n    linkId: {\r\n      type: mongoose.Schema.Types.ObjectId,\r\n      ref: 'Link',\r\n      required: [true, 'Link ID is required for recording clicks'],\r\n      index: true,\r\n    },\r\n    ipAddress: {\r\n      type: String,\r\n      default: 'Anonymous',\r\n    },\r\n    userAgent: {\r\n      type: String,\r\n      default: '',\r\n    },\r\n    deviceType: {\r\n      type: String,\r\n      enum: ['Desktop', 'Mobile', 'Tablet', 'Other'],\r\n      default: 'Desktop',\r\n      index: true,\r\n    },\r\n    browser: {\r\n      type: String,\r\n      default: 'Unknown',\r\n    },\r\n    os: {\r\n      type: String,\r\n      default: 'Unknown',\r\n    },\r\n    referrer: {\r\n      type: String,\r\n      default: 'Direct',\r\n    },\r\n    timestamp: {\r\n      type: Date,\r\n      default: Date.now,\r\n      index: true,\r\n    },\r\n  },\r\n  {\r\n    timestamps: false,\r\n  }\r\n);\r\n\r\nclickSchema.index({ linkId: 1, timestamp: -1 });\r\nclickSchema.index({ linkId: 1, deviceType: 1 });\r\n\r\nmodule.exports = mongoose.model('Click', clickSchema);\r\n","lines":52},{"path":"server/middleware/authMiddleware.js","name":"authMiddleware.js","category":"Backend (MVC Architecture)","ext":"js","code":"const { verifyAccessToken } = require('../utils/tokenHelper');\r\nconst User = require('../models/User');\r\n\r\nconst protect = async (req, res, next) => {\r\n  let token;\r\n\r\n  if (\r\n    req.headers.authorization &&\r\n    req.headers.authorization.startsWith('Bearer ')\r\n  ) {\r\n    token = req.headers.authorization.split(' ')[1];\r\n  }\r\n\r\n  if (!token) {\r\n    return res.status(401).json({\r\n      success: false,\r\n      message: 'Not authorized, no token provided',\r\n    });\r\n  }\r\n\r\n  try {\r\n    const decoded = verifyAccessToken(token);\r\n    const user = await User.findById(decoded.id).select('-refreshToken');\r\n\r\n    if (!user) {\r\n      return res.status(401).json({\r\n        success: false,\r\n        message: 'The user belonging to this token no longer exists',\r\n      });\r\n    }\r\n\r\n    req.user = user;\r\n    next();\r\n  } catch (error) {\r\n    if (error.name === 'TokenExpiredError') {\r\n      return res.status(401).json({\r\n        success: false,\r\n        message: 'Access token expired. Please refresh your session.',\r\n        code: 'TOKEN_EXPIRED',\r\n      });\r\n    }\r\n    return res.status(401).json({\r\n      success: false,\r\n      message: 'Not authorized, invalid token',\r\n    });\r\n  }\r\n};\r\n\r\nconst authorizeRoles = (...roles) => {\r\n  return (req, res, next) => {\r\n    if (!req.user || !roles.includes(req.user.role)) {\r\n      return res.status(403).json({\r\n        success: false,\r\n        message: `Forbidden: Access requires one of the following roles: [${roles.join(', ')}]`,\r\n      });\r\n    }\r\n    next();\r\n  };\r\n};\r\n\r\nmodule.exports = { protect, authorizeRoles };\r\n","lines":62},{"path":"server/middleware/errorMiddleware.js","name":"errorMiddleware.js","category":"Backend (MVC Architecture)","ext":"js","code":"\r\nconst notFoundHandler = (req, res, next) => {\r\n  const error = new Error(`Resource Not Found - ${req.originalUrl}`);\r\n  res.status(404);\r\n  next(error);\r\n};\r\n\r\nconst errorHandler = (err, req, res, next) => {\r\n  let statusCode = res.statusCode === 200 ? 500 : res.statusCode;\r\n  let message = err.message || 'Internal Server Error';\r\n\r\n  if (err.name === 'CastError' && err.kind === 'ObjectId') {\r\n    statusCode = 400;\r\n    message = `Invalid resource identifier: ${err.value}`;\r\n  }\r\n\r\n  if (err.name === 'ValidationError') {\r\n    statusCode = 400;\r\n    message = Object.values(err.errors)\r\n      .map((val) => val.message)\r\n      .join(', ');\r\n  }\r\n\r\n  if (err.code === 11000) {\r\n    statusCode = 409;\r\n    const field = Object.keys(err.keyValue)[0];\r\n    message = `Duplicate value entered for ${field}: \"${err.keyValue[field]}\". Please choose another.`;\r\n  }\r\n\r\n  if (err.name === 'JsonWebTokenError') {\r\n    statusCode = 401;\r\n    message = 'Invalid authentication token';\r\n  }\r\n\r\n  if (err.name === 'TokenExpiredError') {\r\n    statusCode = 401;\r\n    message = 'Authentication token has expired';\r\n  }\r\n\r\n  res.status(statusCode).json({\r\n    success: false,\r\n    message,\r\n    stack: process.env.NODE_ENV === 'development' ? err.stack : undefined,\r\n  });\r\n};\r\n\r\nmodule.exports = { notFoundHandler, errorHandler };\r\n","lines":48},{"path":"server/controllers/authController.js","name":"authController.js","category":"Backend (MVC Architecture)","ext":"js","code":"const User = require('../models/User');\r\nconst {\r\n  generateAccessToken,\r\n  generateRefreshToken,\r\n  verifyRefreshToken,\r\n} = require('../utils/tokenHelper');\r\n\r\nconst register = async (req, res, next) => {\r\n  try {\r\n    const { name, email, password, role } = req.body;\r\n\r\n    if (!name || !email || !password) {\r\n      return res.status(400).json({\r\n        success: false,\r\n        message: 'Please provide name, email, and password',\r\n      });\r\n    }\r\n\r\n    const userExists = await User.findOne({ email: email.toLowerCase() });\r\n    if (userExists) {\r\n      return res.status(409).json({\r\n        success: false,\r\n        message: 'A user with this email address already exists',\r\n      });\r\n    }\r\n\r\n    const userRole = role === 'admin' ? 'admin' : 'user';\r\n\r\n    const user = await User.create({\r\n      name,\r\n      email,\r\n      password,\r\n      role: userRole,\r\n    });\r\n\r\n    const accessToken = generateAccessToken({ id: user._id, role: user.role });\r\n    const refreshToken = generateRefreshToken({ id: user._id });\r\n\r\n    user.refreshToken = refreshToken;\r\n    await user.save();\r\n\r\n    res.status(201).json({\r\n      success: true,\r\n      message: 'User registered successfully',\r\n      user: {\r\n        id: user._id,\r\n        name: user.name,\r\n        email: user.email,\r\n        role: user.role,\r\n      },\r\n      accessToken,\r\n      refreshToken,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst login = async (req, res, next) => {\r\n  try {\r\n    const { email, password } = req.body;\r\n\r\n    if (!email || !password) {\r\n      return res.status(400).json({\r\n        success: false,\r\n        message: 'Please provide both email and password',\r\n      });\r\n    }\r\n\r\n    const user = await User.findOne({ email: email.toLowerCase() });\r\n    if (!user) {\r\n      return res.status(401).json({\r\n        success: false,\r\n        message: 'Invalid email or password',\r\n      });\r\n    }\r\n\r\n    const isMatch = await user.matchPassword(password);\r\n    if (!isMatch) {\r\n      return res.status(401).json({\r\n        success: false,\r\n        message: 'Invalid email or password',\r\n      });\r\n    }\r\n\r\n    const accessToken = generateAccessToken({ id: user._id, role: user.role });\r\n    const refreshToken = generateRefreshToken({ id: user._id });\r\n\r\n    user.refreshToken = refreshToken;\r\n    await user.save();\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      message: 'Login successful',\r\n      user: {\r\n        id: user._id,\r\n        name: user.name,\r\n        email: user.email,\r\n        role: user.role,\r\n      },\r\n      accessToken,\r\n      refreshToken,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst refreshSession = async (req, res, next) => {\r\n  try {\r\n    const { refreshToken } = req.body;\r\n\r\n    if (!refreshToken) {\r\n      return res.status(400).json({\r\n        success: false,\r\n        message: 'Refresh token is required',\r\n      });\r\n    }\r\n\r\n    let decoded;\r\n    try {\r\n      decoded = verifyRefreshToken(refreshToken);\r\n    } catch (err) {\r\n      return res.status(401).json({\r\n        success: false,\r\n        message: 'Invalid or expired refresh token. Please log in again.',\r\n      });\r\n    }\r\n\r\n    const user = await User.findById(decoded.id);\r\n    if (!user || user.refreshToken !== refreshToken) {\r\n      return res.status(401).json({\r\n        success: false,\r\n        message: 'Refresh token not recognized or revoked',\r\n      });\r\n    }\r\n\r\n    const newAccessToken = generateAccessToken({ id: user._id, role: user.role });\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      accessToken: newAccessToken,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst logout = async (req, res, next) => {\r\n  try {\r\n    if (req.user) {\r\n      const user = await User.findById(req.user._id);\r\n      if (user) {\r\n        user.refreshToken = null;\r\n        await user.save();\r\n      }\r\n    }\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      message: 'Logged out successfully',\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst getMe = async (req, res, next) => {\r\n  try {\r\n    const user = await User.findById(req.user._id);\r\n    res.status(200).json({\r\n      success: true,\r\n      user,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nmodule.exports = {\r\n  register,\r\n  login,\r\n  refreshSession,\r\n  logout,\r\n  getMe,\r\n};\r\n","lines":187},{"path":"server/controllers/linkController.js","name":"linkController.js","category":"Backend (MVC Architecture)","ext":"js","code":"const crypto = require('crypto');\r\nconst mongoose = require('mongoose');\r\nconst Link = require('../models/Link');\r\nconst Click = require('../models/Click');\r\n\r\nconst generateShortCode = (length = 7) => {\r\n  return crypto.randomBytes(length).toString('base64url').slice(0, length);\r\n};\r\n\r\nconst createLink = async (req, res, next) => {\r\n  try {\r\n    const { originalUrl, alias, expiresAt } = req.body;\r\n\r\n    if (!originalUrl) {\r\n      return res.status(400).json({\r\n        success: false,\r\n        message: 'Original URL is required',\r\n      });\r\n    }\r\n\r\n    let targetUrl = originalUrl.trim();\r\n    if (!/^https?:\\/\\//i.test(targetUrl)) {\r\n      targetUrl = `https://${targetUrl}`;\r\n    }\r\n\r\n    let shortCode;\r\n\r\n    if (alias && alias.trim()) {\r\n      const cleanedAlias = alias.trim().toLowerCase();\r\n      if (!/^[a-zA-Z0-9-_]{3,30}$/.test(cleanedAlias)) {\r\n        return res.status(400).json({\r\n          success: false,\r\n          message: 'Custom alias must be between 3 and 30 alphanumeric characters (- and _ allowed)',\r\n        });\r\n      }\r\n\r\n      const existing = await Link.findOne({\r\n        $or: [{ shortCode: cleanedAlias }, { alias: cleanedAlias }],\r\n      });\r\n      if (existing) {\r\n        return res.status(409).json({\r\n          success: false,\r\n          message: `The alias \"${cleanedAlias}\" is already taken. Please choose another.`,\r\n        });\r\n      }\r\n\r\n      shortCode = cleanedAlias;\r\n    } else {\r\n      let isUnique = false;\r\n      let attempts = 0;\r\n      while (!isUnique && attempts < 5) {\r\n        shortCode = generateShortCode(6);\r\n        const exists = await Link.findOne({ shortCode });\r\n        if (!exists) {\r\n          isUnique = true;\r\n        }\r\n        attempts++;\r\n      }\r\n    }\r\n\r\n    let expirationDate = null;\r\n    if (expiresAt) {\r\n      const exp = new Date(expiresAt);\r\n      if (isNaN(exp.getTime()) || exp <= new Date()) {\r\n        return res.status(400).json({\r\n          success: false,\r\n          message: 'Expiration date must be a valid future date/time',\r\n        });\r\n      }\r\n      expirationDate = exp;\r\n    }\r\n\r\n    const newLink = await Link.create({\r\n      originalUrl: targetUrl,\r\n      shortCode,\r\n      alias: alias ? alias.trim().toLowerCase() : null,\r\n      createdBy: req.user._id,\r\n      expiresAt: expirationDate,\r\n    });\r\n\r\n    const baseUrl = process.env.BASE_URL || 'http://localhost:5000';\r\n\r\n    res.status(201).json({\r\n      success: true,\r\n      message: 'Short link created successfully',\r\n      link: {\r\n        ...newLink.toObject(),\r\n        shortUrl: `${baseUrl}/${newLink.shortCode}`,\r\n      },\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst getUserLinks = async (req, res, next) => {\r\n  try {\r\n    const { search } = req.query;\r\n    const query = { createdBy: req.user._id };\r\n\r\n    if (search && search.trim()) {\r\n      const searchRegex = new RegExp(search.trim(), 'i');\r\n      query.$or = [\r\n        { originalUrl: searchRegex },\r\n        { shortCode: searchRegex },\r\n        { alias: searchRegex },\r\n      ];\r\n    }\r\n\r\n    const links = await Link.find(query).sort({ createdAt: -1 });\r\n    const baseUrl = process.env.BASE_URL || 'http://localhost:5000';\r\n\r\n    const linksWithUrls = links.map((link) => ({\r\n      ...link.toObject(),\r\n      shortUrl: `${baseUrl}/${link.shortCode}`,\r\n      isExpired: link.isExpired(),\r\n    }));\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      count: links.length,\r\n      links: linksWithUrls,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst getLinkById = async (req, res, next) => {\r\n  try {\r\n    const link = await Link.findById(req.params.id);\r\n\r\n    if (!link) {\r\n      return res.status(404).json({\r\n        success: false,\r\n        message: 'Link not found',\r\n      });\r\n    }\r\n\r\n    if (\r\n      link.createdBy.toString() !== req.user._id.toString() &&\r\n      req.user.role !== 'admin'\r\n    ) {\r\n      return res.status(403).json({\r\n        success: false,\r\n        message: 'Access denied: You do not own this link',\r\n      });\r\n    }\r\n\r\n    const baseUrl = process.env.BASE_URL || 'http://localhost:5000';\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      link: {\r\n        ...link.toObject(),\r\n        shortUrl: `${baseUrl}/${link.shortCode}`,\r\n        isExpired: link.isExpired(),\r\n      },\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst deleteLink = async (req, res, next) => {\r\n  try {\r\n    const link = await Link.findById(req.params.id);\r\n\r\n    if (!link) {\r\n      return res.status(404).json({\r\n        success: false,\r\n        message: 'Link not found',\r\n      });\r\n    }\r\n\r\n    if (\r\n      link.createdBy.toString() !== req.user._id.toString() &&\r\n      req.user.role !== 'admin'\r\n    ) {\r\n      return res.status(403).json({\r\n        success: false,\r\n        message: 'Access denied: You can only delete your own links',\r\n      });\r\n    }\r\n\r\n    await Link.findByIdAndDelete(link._id);\r\n    await Click.deleteMany({ linkId: link._id });\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      message: 'Link and associated analytics deleted successfully',\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst getLinkAnalytics = async (req, res, next) => {\r\n  try {\r\n    const link = await Link.findById(req.params.id);\r\n\r\n    if (!link) {\r\n      return res.status(404).json({\r\n        success: false,\r\n        message: 'Link not found',\r\n      });\r\n    }\r\n\r\n    if (\r\n      link.createdBy.toString() !== req.user._id.toString() &&\r\n      req.user.role !== 'admin'\r\n    ) {\r\n      return res.status(403).json({\r\n        success: false,\r\n        message: 'Access denied: You can only view analytics for your own links',\r\n      });\r\n    }\r\n\r\n    const linkObjectId = new mongoose.Types.ObjectId(link._id);\r\n\r\n    const clicksByDay = await Click.aggregate([\r\n      { $match: { linkId: linkObjectId } },\r\n      {\r\n        $group: {\r\n          _id: {\r\n            $dateToString: { format: '%Y-%m-%d', date: '$timestamp' },\r\n          },\r\n          clicks: { $sum: 1 },\r\n        },\r\n      },\r\n      { $sort: { _id: 1 } },\r\n      {\r\n        $project: {\r\n          date: '$_id',\r\n          clicks: 1,\r\n          _id: 0,\r\n        },\r\n      },\r\n    ]);\r\n\r\n    const clicksByDevice = await Click.aggregate([\r\n      { $match: { linkId: linkObjectId } },\r\n      {\r\n        $group: {\r\n          _id: '$deviceType',\r\n          clicks: { $sum: 1 },\r\n        },\r\n      },\r\n      { $sort: { clicks: -1 } },\r\n      {\r\n        $project: {\r\n          device: '$_id',\r\n          clicks: 1,\r\n          _id: 0,\r\n        },\r\n      },\r\n    ]);\r\n\r\n    const clicksByBrowser = await Click.aggregate([\r\n      { $match: { linkId: linkObjectId } },\r\n      {\r\n        $group: {\r\n          _id: '$browser',\r\n          clicks: { $sum: 1 },\r\n        },\r\n      },\r\n      { $sort: { clicks: -1 } },\r\n      {\r\n        $project: {\r\n          browser: '$_id',\r\n          clicks: 1,\r\n          _id: 0,\r\n        },\r\n      },\r\n    ]);\r\n\r\n    const clicksByOS = await Click.aggregate([\r\n      { $match: { linkId: linkObjectId } },\r\n      {\r\n        $group: {\r\n          _id: '$os',\r\n          clicks: { $sum: 1 },\r\n        },\r\n      },\r\n      { $sort: { clicks: -1 } },\r\n      {\r\n        $project: {\r\n          os: '$_id',\r\n          clicks: 1,\r\n          _id: 0,\r\n        },\r\n      },\r\n    ]);\r\n\r\n    const recentClicks = await Click.find({ linkId: linkObjectId })\r\n      .sort({ timestamp: -1 })\r\n      .limit(10)\r\n      .select('-__v');\r\n\r\n    const baseUrl = process.env.BASE_URL || 'http://localhost:5000';\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      link: {\r\n        id: link._id,\r\n        originalUrl: link.originalUrl,\r\n        shortCode: link.shortCode,\r\n        alias: link.alias,\r\n        shortUrl: `${baseUrl}/${link.shortCode}`,\r\n        totalClicks: link.clicksCount,\r\n        isBlocked: link.isBlocked,\r\n        blockReason: link.blockReason,\r\n        expiresAt: link.expiresAt,\r\n        isExpired: link.isExpired(),\r\n        createdAt: link.createdAt,\r\n      },\r\n      analytics: {\r\n        clicksByDay,\r\n        clicksByDevice,\r\n        clicksByBrowser,\r\n        clicksByOS,\r\n        recentClicks,\r\n      },\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nmodule.exports = {\r\n  createLink,\r\n  getUserLinks,\r\n  getLinkById,\r\n  deleteLink,\r\n  getLinkAnalytics,\r\n};\r\n","lines":337},{"path":"server/controllers/redirectController.js","name":"redirectController.js","category":"Backend (MVC Architecture)","ext":"js","code":"const Link = require('../models/Link');\r\nconst Click = require('../models/Click');\r\nconst { parseUserAgent } = require('../utils/deviceHelper');\r\n\r\nconst handleRedirect = async (req, res, next) => {\r\n  try {\r\n    const { code } = req.params;\r\n\r\n    if (!code || ['favicon.ico', 'robots.txt', 'api', 'health'].includes(code.toLowerCase())) {\r\n      return next();\r\n    }\r\n\r\n    const link = await Link.findOne({ shortCode: code });\r\n\r\n    if (!link) {\r\n      return res.status(404).send(`\r\n        <!DOCTYPE html>\r\n        <html lang=\"en\">\r\n        <head>\r\n          <meta charset=\"UTF-8\">\r\n          <title>Link Not Found – ShortLink</title>\r\n          <style>\r\n            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #09090b; color: #f4f4f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }\r\n            .card { background: #18181b; d by an administrator due to safety or policy violations.</p>\r\n            ${link.blockReason ? `<div class=\"reason\">Reason: ${link.blockReason}</div>` : ''}\r\n          </div>\r\n        </body>\r\n        </html>\r\n      `);\r\n    }\r\n\r\n    if (link.isExpired()) {\r\n      return res.status(410).send(`\r\n        <!DOCTYPE html>\r\n        <html lang=\"en\">\r\n        <head>\r\n          <meta charset=\"UTF-8\">\r\n          <title>Link Expired – ShortLink</title>\r\n          <style>\r\n            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #09090b; color: #f4f4f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }\r\n            .card { background: #18181b; border: 1px solid #eab308; padding: 2.5rem; border-radius: 12px; max-width: 440px; text-align: center; }\r\n            h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #eab308; }\r\n            p { color: #a1a1aa; line-height: 1.6; font-size: 0.95rem; }\r\n          </style>\r\n        </head>\r\n        <body>\r\n          <div class=\"card\">\r\n            <h1>Link Expired</h1>\r\n            <p>This short link expired on <strong>${new Date(link.expiresAt).toLocaleString()}</strong> and is no longer accessible.</p>\r\n          </div>\r\n        </body>\r\n        </html>\r\n      `);\r\n    }\r\n\r\n    await Link.findByIdAndUpdate(link._id, { $inc: { clicksCount: 1 } });\r\n\r\n    const rawUa = req.headers['user-agent'] || '';\r\n    const { deviceType, browser, os } = parseUserAgent(rawUa);\r\n    const ipAddress = (req.headers['x-forwarded-for'] || req.socket.remoteAddress || '127.0.0.1').split(',')[0].trim();\r\n    const referrer = req.headers['referer'] || req.headers['referrer'] || 'Direct';\r\n\r\n    Click.create({\r\n      linkId: link._id,\r\n      ipAddress,\r\n      userAgent: rawUa,\r\n      deviceType,\r\n      browser,\r\n      os,\r\n      referrer,\r\n      timestamp: new Date(),\r\n    }).catch((err) => {\r\n      console.error('[Click Analytics Error]', err.message);\r\n    });\r\n\r\n    return res.redirect(302, link.originalUrl);\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nmodule.exports = { handleRedirect };\r\n","lines":119},{"path":"server/controllers/adminController.js","name":"adminController.js","category":"Backend (MVC Architecture)","ext":"js","code":"const mongoose = require('mongoose');\r\nconst Link = require('../models/Link');\r\nconst User = require('../models/User');\r\nconst Click = require('../models/Click');\r\n\r\nconst getAllLinks = async (req, res, next) => {\r\n  try {\r\n    const { search, status, page = 1, limit = 20 } = req.query;\r\n    const query = {};\r\n\r\n    if (search && search.trim()) {\r\n      const searchRegex = new RegExp(search.trim(), 'i');\r\n      query.$or = [\r\n        { originalUrl: searchRegex },\r\n        { shortCode: searchRegex },\r\n        { alias: searchRegex },\r\n      ];\r\n    }\r\n\r\n    if (status === 'blocked') {\r\n      query.isBlocked = true;\r\n    } else if (status === 'active') {\r\n      query.isBlocked = false;\r\n    }\r\n\r\n    const skip = (Number(page) - 1) * Number(limit);\r\n    const total = await Link.countDocuments(query);\r\n\r\n    const links = await Link.find(query)\r\n      .populate('createdBy', 'name email role')\r\n      .sort({ createdAt: -1 })\r\n      .skip(skip)\r\n      .limit(Number(limit));\r\n\r\n    const baseUrl = process.env.BASE_URL || 'http://localhost:5000';\r\n\r\n    const formattedLinks = links.map((link) => ({\r\n      ...link.toObject(),\r\n      shortUrl: `${baseUrl}/${link.shortCode}`,\r\n      isExpired: link.isExpired(),\r\n    }));\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      total,\r\n      page: Number(page),\r\n      pages: Math.ceil(total / Number(limit)),\r\n      links: formattedLinks,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst updateLinkStatus = async (req, res, next) => {\r\n  try {\r\n    const { isBlocked, blockReason } = req.body;\r\n    const link = await Link.findById(req.params.id);\r\n\r\n    if (!link) {\r\n      return res.status(404).json({\r\n        success: false,\r\n        message: 'Link not found',\r\n      });\r\n    }\r\n\r\n    link.isBlocked = isBlocked !== undefined ? Boolean(isBlocked) : link.isBlocked;\r\n    if (blockReason !== undefined) {\r\n      link.blockReason = blockReason.trim();\r\n    }\r\n\r\n    await link.save();\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      message: link.isBlocked ? 'Link has been blocked' : 'Link has been unblocked',\r\n      link,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst getAllUsers = async (req, res, next) => {\r\n  try {\r\n    const users = await User.find().select('-refreshToken').sort({ createdAt: -1 });\r\n\r\n    const userLinkCounts = await Link.aggregate([\r\n      { $group: { _id: '$createdBy', totalLinks: { $sum: 1 }, totalClicks: { $sum: '$clicksCount' } } },\r\n    ]);\r\n\r\n    const countMap = {};\r\n    userLinkCounts.forEach((c) => {\r\n      countMap[c._id.toString()] = {\r\n        totalLinks: c.totalLinks,\r\n        totalClicks: c.totalClicks,\r\n      };\r\n    });\r\n\r\n    const enrichedUsers = users.map((u) => ({\r\n      ...u.toObject(),\r\n      totalLinks: countMap[u._id.toString()]?.totalLinks || 0,\r\n      totalClicks: countMap[u._id.toString()]?.totalClicks || 0,\r\n    }));\r\n\r\n    res.status(200).json({\r\n      success: true,\r\n      count: users.length,\r\n      users: enrichedUsers,\r\n    });\r\n  } catch (error) {\r\n    next(error);\r\n  }\r\n};\r\n\r\nconst getSystemStats = async (req, res, next) => {\r\n  try {\r\n    const totalUsers = await User.countDocuments();\r\n    const totalLinks = await Link.countDocuments();\r\n    const blockedLinks = await Link.countDocuments({ isBlocked: true });\r\n    const totalClicks = await Click.countD ster,\r\n    logout,\r\n  };\r\n\r\n  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;\r\n};\r\n\r\nexport const useAuth = () => {\r\n  const context = useContext(AuthContext);\r\n  if (!context) {\r\n    throw new Error('useAuth must be used within an AuthProvider');\r\n  }\r\n  return context;\r\n};\r\n","lines":79},{"path":"client/src/services/api.js","name":"api.js","category":"Frontend (React & Context API)","ext":"js","code":"\r\nconst API_BASE = 'http://localhost:5000/api';\r\n\r\nexport const getStoredTokens = () => {\r\n  return {\r\n    accessToken: localStorage.getItem('shortlink_access_token'),\r\n    refreshToken: localStorage.getItem('shortlink_refresh_token'),\r\n  };\r\n};\r\n\r\nexport const setStoredTokens = (accessToken, refreshToken) => {\r\n  if (accessToken) localStorage.setItem('shortlink_access_token', accessToken);\r\n  if (refreshToken) localStorage.setItem('shortlink_refresh_token', refreshToken);\r\n};\r\n\r\nexport const clearStoredTokens = () => {\r\n  localStorage.removeItem('shortlink_access_token');\r\n  localStorage.removeItem('shortlink_refresh_token');\r\n  localStorage.removeItem('shortlink_user');\r\n};\r\n\r\nlet isRefreshing = false;\r\nlet refreshSubscribers = [];\r\n\r\nconst subscribeTokenRefresh = (cb) => {\r\n  refreshSubscribers.push(cb);\r\n};\r\n\r\nconst onRefreshed = (newAccessToken) => {\r\n  refreshSubscribers.forEach((cb) => cb(newAccessToken));\r\n  refreshSubscribers = [];\r\n};\r\n\r\nexport const fetchWithAuth = async (endpoint, options = {}) => {\r\n  const { accessToken, refreshToken } = getStoredTokens();\r\n\r\n  const headers = {\r\n    'Content-Type': 'application/json',\r\n    ...(options.headers || {}),\r\n  };\r\n\r\n  if (accessToken) {\r\n    headers['Authorization'] = `Bearer ${accessToken}`;\r\n  }\r\n\r\n  let res = await fetch(`${API_BASE}${endpoint}`, {\r\n    ...options,\r\n    headers,\r\n  });\r\n\r\n  if (res.status === 401 && refreshToken && !endpoint.includes('/auth/')) {\r\n    if (!isRefreshing) {\r\n      isRefreshing = true;\r\n\r\n      try {\r\n        const refreshRes = await fetch(`${API_BASE}/auth/refresh`, {\r\n          method: 'POST',\r\n          headers: { 'Content-Type': 'application/json' },\r\n          body: JSON.stringify({ refreshToken }),\r\n        });\r\n\r\n        const refreshData = await refreshRes.json();\r\n\r\n        if (refreshRes.ok && refreshData.accessToken) {\r\n          setStoredTokens(refreshData.accessToken, null);\r\n          onRefreshed(refreshData.accessToken);\r\n        } else {\r\n          clearStoredTokens();\r\n          window.location.href = '/login';\r\n          return Promise.reject(new Error('Session expired, please login again'));\r\n        }\r\n      } catch (err) {\r\n        clearStoredTokens();\r\n        window.location.href = '/login';\r\n        return Promise.reject(err);\r\n      } finally {\r\n        isRefreshing = false;\r\n      }\r\n    }\r\n\r\n    const retryPromise = new Promise((resolve) => {\r\n      subscribeTokenRefresh((newAccessToken) => {\r\n        headers['Authorization'] = `Bearer ${newAccessToken}`;\r\n        resolve(\r\n          fetch(`${API_BASE}${endpoint}`, {\r\n            ...options,\r\n            headers,\r\n          })\r\n        );\r\n      });\r\n    });\r\n\r\n    res = await retryPromise;\r\n  }\r\n\r\n  const data = await res.json().catch(() => ({}));\r\n\r\n  if (!res.ok) {\r\n    const error = new Error(data.message || `Request failed with status ${res.status}`);\r\n    error.status = res.status;\r\n    error.data = data;\r\n    throw error;\r\n  }\r\n\r\n  return data;\r\n};\r\n\r\nexport const api = {\r\n  register: (payload) =>\r\n    fetch(`${API_BASE}/auth/register`, {\r\n      method: 'POST',\r\n      headers: { 'Content-Type': 'application/json' },\r\n      body: JSON.stringify(payload),\r\n    }).then(async (r) => {\r\n      const d = await r.json();\r\n      if (!r.ok) throw new Error(d.message || 'Registration failed');\r\n      return d;\r\n    }),\r\n\r\n  login: (payload) =>\r\n    fetch(`${API_BASE}/auth/login`, {\r\n      method: 'POST',\r\n      headers: { 'Content-Type': 'application/json' },\r\n      body: JSON.stringify(payload),\r\n    }).then(async (r) => {\r\n      const d = await r.json();\r\n      if (!r.ok) throw new Error(d.message || 'Login failed');\r\n      return d;\r\n    }),\r\n\r\n  logout: () => fetchWithAuth('/auth/logout', { method: 'POST' }),\r\n  getProfile: () => fetchWithAuth('/auth/me'),\r\n\r\n  createLink: (payload) => fetchWithAuth('/links', { method: 'POST', body: JSON.stringify(payload) }),\r\n  getUserLinks: (search = '') => fetchWithAuth(`/links${search ? `?search=${encodeURIComponent(search)}` : ''}`),\r\n  getLinkById: (id) => fetchWithAuth(`/links/${id}`),\r\n  deleteLink: (id) => fetchWithAuth(`/links/${id}`, { method: 'DELETE' }),\r\n\r\n  getLinkAnalytics: (id) => fetchWithAuth(`/links/${id}/analytics`),\r\n\r\n  getAdminLinks: ({ search = '', status = '', page = 1, limit = 20 } = {}) => {\r\n    const params = new URLSearchParams({ page, limit });\r\n    if (search) params.append('search', search);\r\n    if (status) params.append('status', status);\r\n    return fetchWithAuth(`/admin/links?${params.toString()}`);\r\n  },\r\n  updateLinkStatus: (id, payload) =>\r\n    fetchWithAuth(`/admin/links/${id}/status`, { method: 'PATCH', body: JSON.stringify(payload) }),\r\n  getAdminUsers: () => fetchWithAuth('/admin/users'),\r\n  getAdminStats: () => fetchWithAuth('/admin/stats'),\r\n};\r\n","lines":152},{"path":"client/src/components/Navbar.jsx","name":"Navbar.jsx","category":"Frontend (React & Context API)","ext":"jsx","code":"import React from 'react';\r\nimport { Link, NavLink, useNavigate } from 'react-router-dom';\r\nimport { useAuth } from '../context/AuthContext';\r\nimport { IconLink, IconShield, IconLogOut } from './Icons';\r\n\r\nexport const Navbar = () => {\r\n  const { user, isAuthenticated, isAdmin, logout } = useAut es...</p>\n      </div>\n    );\n  }\n\n  if (!isAuthenticated) {\n    return <Navigate to=\"/login\" replace />;\n  }\n\n  if (!isAdmin) {\n    return <Navigate to=\"/dashboard\" replace />;\n  }\n\n  return children;\n};\n","lines":26},{"path":"client/src/components/CreateLinkModal.jsx","name":"CreateLinkModal.jsx","category":"Frontend (React & Context API)","ext":"jsx","code":"import React, { useState } from 'react';\nimport { api } from '../services/api';\nimport { IconLink, IconClock, IconAlert } from './Icons';\n\nexport const CreateLinkModal = ({ isOpen, onClose, onLinkCreated }) => {\n  const [originalUrl, setOriginalUrl] = useState('');\n  const [alias, setAlias] = useState('');\n  const [expiresAt, setExpiresAt] = useState('');\n  const [isSubmitting, setIsSubmitting] = useState(false);\n  const [error, setError] = useState('');\n\n  if (!isOpen) return null;\n\n  const handleSubmit = async (e) => {\n    e.preventDefault();\n    setError('');\n\n    if (!originalUrl.trim()) {\n      setError('Please provide a destination URL');\n      return;\n    }\n\n    try {\n      setIsSubmitting(true);\n      const payload = {\n        originalUrl: originalUrl.trim(),\n        alias: alias.trim() || undefined,\n        expiresAt: expiresAt || undefined,\n      };\n\n      const res = await api.createLink(payload);\n      if (res.success) {\n        setOriginalUrl('');\n        setAlias('');\n        setExpiresAt('');\n        onLinkCreated(res.link);\n        onClose();\n      }\n    } catch (err) {\n      setError(err.message || 'Failed to create short link');\n    } finally {\n      setIsSubmitting(false);\n    }\n  };\n\n  return (\n    <div className=\"modal-overlay\" onClick={onClose}>\n      <div className=\"modal-content\" onClick={(e) => e.stopPropagation()}>\n        <div className=\"modal-header\">\n          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>\n            <IconLink size={18} style={{ color: 'var(--accent)' }} />\n            <h3>Create Short Link</h3>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"btn btn-icon\"\n            style={{ border: 'none', fontSize: '1.25rem', padding: '0.2rem 0.5rem' }}\n          >\n            &times;\n          </button>\n        </div>\n\n        <form onSubmit={handleSubmit}>\n          <div className=\"modal-body\">\n            {error && (\n              <div className=\"alert alert-danger\">\n                <IconAlert size={16} />\n                <span>{error}</span>\n              </div>\n            )}\n\n            <div className=\"form-group\">\n              <label className=\"form-label\">\n                Destination URL <span style={{ color: 'var(--danger)' }}>*</span>\n              </label>\n              <input\n                type=\"text\"\n                className=\"form-input\"\n                placeholder=\"https://example.com/very/long/destination/url\"\n                value={originalUrl}\n                onChange={(e) => setOriginalUrl(e.target.value)}\n                autoFocus\n                required\n              />\n              <span className=\"form-helper\">The destination webpage you want to redirect visitors to.</span>\n            </div>\n\n            <div className=\"form-group\">\n              <label className=\"form-label\">Custom Alias (Optional)</label>\n              <div style={{ display: 'flex', alignItems: 'center' }}>\n                <span\n                  style={{\n                    backgroundColor: 'var(--bg-card)',\n                    border: '1px solid var(--border-subtle)',\n                    borderRight: 'none',\n                    padding: '0.625rem 0.75rem',\n                    borderTopLeftRadius: 'var(--radius-sm)',\n                    borderBottomLeftRadius: 'var(--radius-sm)',\n                    color: 'var(--text-muted)',\n                    fontSize: '0.85rem',\n                    fontFamily: 'var(--font-mono)',\n                  }}\n                >\n                  shortlink.dev/\n                </span>\n                <input\n                  type=\"text\"\n                  className=\"form-input\"\n                  placeholder=\"my-custom-slug\"\n                  value={alias}\n                  onChange={(e) => setAlias(e.target.value.toLowerCase().replace(/[^a-z0-9-_]/g, ''))}\n                  style={{\n                    borderTopLeftRadius: 0,\n                    borderBottomLeftRadius: 0,\n                    fontFamily: 'var(--font-mono)',\n                  }}\n                />\n              </div>\n              <span className=\"form-helper\">Leave blank to generate a high-entropy crypto short code automatically.</span>\n            </div>\n\n            <div className=\"form-group\" style={{ marginBottom: 0 }}>\n              <label className=\"form-label\" style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>\n                <IconClock size={14} />\n                Expiration Date (Optional)\n              </label>\n              <input\n                type=\"datetime-local\"\n                className=\"form-input\"\n                value={expiresAt}\n                onChange={(e) => setExpiresAt(e.target.value)}\n              />\n              <span className=\"form-helper\">The link will automatically stop redirecting after this timestamp.</span>\n            </div>\n          </div>\n\n          <div className=\"modal-footer\">\n            <button type=\"button\" onClick={onClose} className=\"btn btn-secondary\">\n              Cancel\n            </button>\n            <button type=\"submit\" disabled={isSubmitting} className=\"btn btn-primary\">\n              {isSubmitting ? 'Creating...' : 'Shorten URL'}\n            </button>\n          </div>\n        </form>\n      </div>\n    </div>\n  );\n};\n","lines":150},{"path":"client/src/components/AnalyticsModal.jsx","name":"AnalyticsModal.jsx","category":"Frontend (React & Context AP    <div className=\"card\">\r\n                  <h4 style={{ fontSize: '0.9rem', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>\r\n                    <IconSmartphone size={16} style={{ color: 'var(--accent)' }} />\r\n                    Clicks by Device Type (Aggregation)\r\n                  </h4>\r\n\r\n                  {clicksByDevice.length === 0 ? (\r\n                    <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>No device data recorded yet.</p>\r\n                  ) : (\r\n                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>\r\n                      {clicksByDevice.map((item) => {\r\n                        const percentage = totalClicks > 0 ? Math.round((item.clicks / totalClicks) * 100) : 0;\r\n                        return (\r\n                          <div key={item.device}>\r\n                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.825rem', marginBottom: '0.25rem' }}>\r\n                              <span style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>\r\n                                {getDeviceIcon(item.device)}\r\n                                {item.device}\r\n                              </span>\r\n                              <span style={{ fontFamily: 'var(--font-mono)' }}>\r\n                                {item.clicks} ({percentage}%)\r\n                              </span>\r\n                            </div>\r\n                            <div style={{ height: '6px', backgroundColor: 'var(--bg-app)', borderRadius: '3px', overflow: 'hidden' }}>\r\n                              <div\r\n                                style={{\r\n                                  width: `${percentage}%`,\r\n                                  height: '100%',\r\n                                  backgroundColor: 'var(--accent)',\r\n                                  borderRadius: '3px',\r\n                                }}\r\n                              />\r\n                            </div>\r\n                          </div>\r\n                        );\r\n                      })}\r\n                    </div>\r\n                  )}\r\n                </div>\r\n\r\n                {/* 2. Clicks by Day Aggregation */}\r\n                <div className=\"card\">\r\n                  <h4 style={{ fontSize: '0.9rem', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>\r\n                    <IconClock size={16} style={{ color: '#34d399' }} />\r\n                    Daily Traffic Timeline (Aggregation)\r\n                  </h4>\r\n\r\n                  {clicksByDay.length === 0 ? (\r\n                    <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>No clicks recorded yet.</p>\r\n                  ) : (\r\n                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>\r\n                      {clicksByDay.map((item) => {\r\n                        const maxDaily = Math.max(...clicksByDay.map((d) => d.clicks), 1);\r\n                        const fillWidth = Math.round((item.clicks / maxDaily) * 100);\r\n                        return (\r\n                          <div key={item.date} style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>\r\n                            <span style={{ fontSize: '0.75rem', fontFamily: 'var(--font-mono)', color: 'var(--text-secondary)', width: '85px' }}>\r\n                              {item.date}\r\n                            </span>\r\n                            <div style={{ flex: 1, height: '8px', backgroundColor: 'var(--bg-app)', borderRadius: '4px', overflow: 'hidden' }}>\r\n                              <div\r\n                                style={{\r\n                                  width: `${fillWidth}%`,\r\n                                  height: '100%',\r\n                                  backgroundColor: '#10b981',\r\n                                  borderRadius: '4px',\r\n                                }}\r\n                              />\r\n                            </div>\r\n                            <span style={{ fontSize: '0.8rem', fontFamily: 'var(--font-mono)', fontWeight: 600, width: '30px', textAlign: 'right' }}>\r\n                              {item.clicks}\r\n                            </span>\r\n                          </div>\r\n                        );\r\n                      })}\r\n                    </div>\r\n                  )}\r\n                </div>\r\n              </div>\r\n\r\n              {/* 3. Recent Click Stream */}\r\n              <div className=\"card\" style={{ padding: '1rem' }}>\r\n                <h4 style={{ fontSize: '0.875rem', marginBottom: '0.75rem' }}>Recent Click Activity Stream</h4>\r\n                {recentClicks.length === 0 ? (\r\n                  <p style={{ fontSize: '0.825rem', color: 'var(--text-muted)' }}>No recent click events yet.</p>\r\n                ) : (\r\n                  <div className=\"table-wrapper\">\r\n                    <table className=\"data-table\">\r\n                      <thead>\r\n                        <tr>\r\n                          <th>Timestamp</th>\r\n                          <th>Device</th>\r\n                          <th>Browser</th>\r\n                          <th>OS</th>\r\n                          <th>Referrer</th>\r\n                        </tr>\r\n                      </thead>\r\n                      <tbody>\r\n                        {recentClicks.map((c) => (\r\n                          <tr key={c._id}>\r\n                            <td style={{ fontSize: '0.8rem', fontFamily: 'var(--font-mono)' }}>\r\n                              {new Date(c.timestamp).toLocaleString()}\r\n                            </td>\r\n                            <td>\r\n                              <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.3rem' }}> splay: 'flex', flexDirection: 'column', gap: '0.75rem' }}>\r\n          <div style={{ color: 'var(--accent)', background: 'var(--accent-soft)', width: 'fit-content', padding: '0.5rem', borderRadius: 'var(--radius-sm)' }}>\r\n            <IconLink size={20} />\r\n          </div>\r\n          <h3 style={{ fontSize: '1.05rem' }}>High-Entropy Crypto Short Codes</h3>\r\n          <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', lineHeight: 1.5 }}>\r\n            Generated with Node.js <code>crypto</code> base64url generation or user-defined custom aliases, backed by unique Mongoose indexes.\r\n          </p>\r\n        </div>\r\n\r\n        <div className=\"card\" style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>\r\n          <div style={{ color: '#10b981', background: 'var(--success-soft)', width: 'fit-content', padding: '0.5rem', borderRadius: 'var(--radius-sm)' }}>\r\n            <IconBarChart size={20} />\r\n          </div>\r\n          <h3 style={{ fontSize: '1.05rem' }}>Aggregation Analytics</h3>\r\n          <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', lineHeight: 1.5 }}>\r\n            MongoDB aggregation pipelines aggregate clicks by day and device type (Mobile, Desktop, Tablet) extracted live from the <code>User-Agent</code>.\r\n          </p>\r\n        </div>\r\n\r\n        <div className=\"card\" style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>\r\n          <div style={{ color: '#c084fc', background: 'rgba(168, 85, 247, 0.15)', width: 'fit-content', padding: '0.5rem', borderRadius: 'var(--radius-sm)' }}>\r\n            <IconShield size={20} />\r\n          </div>\r\n          <h3 style={{ fontSize: '1.05rem' }}>Role-Based Access Control (RBAC)</h3>\r\n          <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', lineHeight: 1.5 }}>\r\n            Admin supervisors can inspect system-wide link distribution, monitor traffic metrics, and suspend or block abusive links y {\n      setIsSubmitting(false);\n    }\n  };\n\n  return (\n    <div style={{ maxWidth: '420px', margin: '3rem auto', width: '100%' }}>\n      <div className=\"card\" style={{ padding: '2rem' }}>\n        <div style={{ textAlign: 'center', marginBottom: '1.75rem' }}>\n          <div\n            style={{\n              width: '42px',\n              height: '42px',\n              background: 'var(--accent-soft)',\n              borderRadius: 'var(--radius-sm)',\n              color: 'var(--accent)',\n              display: 'inline-flex',\n              alignItems: 'center',\n              justifyContent: 'center',\n              marginBottom: '0.75rem',\n            }}\n          >\n            <IconLink size={22} />\n          </div>\n          <h2 style={{ fontSize: '1.35rem' }}>Sign In to ShortLink</h2>\n          <p style={{ fontSize: '0.825rem', color: 'var(--text-secondary)', marginTop: '0.25rem' }}>\n            Manage your short URLs and track detailed click analytics\n          </p>\n        </div>\n\n        {error && (\n          <div className=\"alert alert-danger\">\n            <IconAlert size={16} />\n            <span>{error}</span>\n          </div>\n        )}\n\n        <form onSubmit={handleSubmit}>\n          <div className=\"form-group\">\n            <label className=\"form-label\">Email Address</label>\n            <input\n              type=\"email\"\n              className=\"form-input\"\n              placeholder=\"alex@example.com\"\n              value={email}\n              onChange={(e) => setEmail(e.target.value)}\n              autoFocus\n              required\n            />\n          </div>\n\n          <div className=\"form-group\" style={{ marginBottom: '1.5rem' }}>\n            <label className=\"form-label\">Password</label>\n            <input\n              type=\"password\"\n              className=\"form-input\"\n              placeholder=\"••••••••\"\n              value={password}\n              onChange={(e) => setPassword(e.target.value)}\n              required\n            />\n          </div>\n\n          <button\n            type=\"submit\"\n            disabled={isSubmitting}\n            className=\"btn btn-primary\"\n            style={{ width: '100%', padding: '0.7rem' }}\n          >\n            {isSubmitting ? 'Authenticating...' : 'Sign In'}\n          </button>\n        </form>\n\n        <div style={{ textAlign: 'center', marginTop: '1.5rem', fontSize: '0.85rem', color: 'var(--text-secondary)' }}>\n          Don't have an account?{' '}\n          <Link to=\"/register\" style={{ color: 'var(--accent)', fontWeight: 500 }}>\n            Create one free\n          </Link>\n        </div>\n      </div>\n    </div>\n  );\n};\n","lines":116},{"path":"client/src/pages/RegisterPage.jsx","name":"RegisterPage.jsx","category":"Frontend (React & Context API)","ext":"jsx","code":"import React, { useState } from 'react';\r\nimport { Link, useNavigate } from 'react-router-dom';\r\nimport { useAuth } from '../context/AuthContext';\r\nimport { IconLink, IconAlert, IconShield } from '../components/Icons';\r\n\r\nexport const RegisterPage = () => {\r\n  const [name, setName] = useState('');\r\n  const [email, setEmail] = useState('');\r\n  const [password, setPassword] = useState('');\r\n  const [role, setRole] = useState('user');\r\n  const [error, setError] = useState('');\r\n  const [isSubmitting, setIsSubmitting] = useState(false);\r\n\r\n  const { register } = useAuth();\r\n  const navigate = useNavigate();\r\n\r\n  const handleSubmit = async (e) => {\r\n    e.preventDefault();\r\n    setError('');\r\n\r\n    if (!name || !email || !password) {\r\n      setError('Please fill in all required fields');\r\n      return;\r\n    }\r\n\r\n    if (password.length < 6) {\r\n      setError('Password must be at least 6 characters');\r\n      return;\r\n    }\r\n\r\n    try {\r\n      setIsSubmitting(true);\r\n      await register(name, email, password, role);\r\n      navigate('/dashboard', { replace: true });\r\n    } catch (err) {\r\n      setError(err.message || 'Registration failed');\r\n    } finally {\r\n      setIsSubmitting(false);\r\n    }\r\n  };\r\n\r\n  return (\r\n    <div style={{ maxWidth: '460px', margin: '2.5rem auto', width: '100%' }}>\r\n      <div className=\"card\" style={{ padding: '2rem' }}>\r\n        <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>\r\n          <div\r\n            style={{\r\n              width: '42px',\r\n              height: '42px',\r\n              background: 'var(--accent-soft)',\r\n              borderRadius: 'var(--radius-sm)',\r\n              color: 'var(--accent)',\r\n              display: 'inline-flex',\r\n              alignItems: 'center',\r\n              justifyContent: 'center',\r\n              marginBottom: '0.75rem',\r\n            }}\r\n          >\r\n            <IconLink size={22} />\r\n          </div>\r\n          <h2 style={{ fontSize: '1.35rem' }}>Create Your Account</h2>\r\n          <p style={{ fontSize: '0.825rem', color: 'var(--text-secondary)', marginTop: '0.25rem' }}>\r\n            Register to shorten URLs and view analytics\r\n          </p>\r\n        </div>\r\n\r\n        {error && (\r\n          <div className=\"alert alert-danger\">\r\n            <IconAlert size={16} />\r\n            <span>{error}</span>\r\n          </div>\r\n        )}\r\n\r\n        <form onSubmit={handleSubmit}>\r\n          <div className=\"form-group\">\r\n            <label className=\"form-label\">Full Name</label>\r\n            <input\r\n              type=\"text\"\r\n              className=\"form-input\"\r\n              placeholder=\"Alex Johnson\"\r\n              value={name}\r\n              onChange={(e) => setName(e.target.value)}\r\n              required\r\n              autoFocus\r\n            />\r\n          </div>\r\n\r\n          <div className=\"form-group\">\r\n            <label className=\"form-label\">Email Address</label>\r\n            <input\r\n              type=\"email\"\r\n              className=\"form-input\"\r\n              placeholder=\"alex@example.com\"\r\n              value={email}\r\n              onChange={(e) => setEmail(e.target.value)}\r\n              required\r\n            />\r\n          </div>\r\n\r\n          <div className=\"form-group\">\r\n            <label className=\"form-label\">Password (Min. 6 characters)</label>\r\n            <input\r\n              type=\"password\"\r\n              className=\"form-input\"\r\n              placeholder=\"••••••••\"\r\n              value={password}\r\n              onChange={(e) => setPassword(e.target.value)}\r\n              required\r\n              minLength={6}\r\n            />\r\n          </div>\r\n\r\n          {/* Role selector for test/grading convenience */}\r\n          <div className=\"form-group\" style={{ marginBottom: '1.5rem' }}>\r\n            <label className=\"form-label\" style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>\r\n              <IconShield size={14} />\r\n              Account Role (RBAC Selection)\r\n            </label>\r\n            <select\r\n              className=\"form-select\"\r\n              value={role}\r\n              onChange={(e) => setRole(e.target.value)}\r\n            >\r\n              <option value=\"user\">User (Standard Link Creator)</option>\r\n              <option value=\"admin\">Admin (Moderation & System Overview)</option>\r\n            </select>\r\n            <span className=\"form-helper\">\r\n              Select <strong>Admin</strong> if you want to test and grade the RBAC protected administration routes.\r\n            </span>\r\n          </div>\r\n\r\n          <button\r\n            type=\"submit\"\r\n            disabled={isSubmitting}\r\n            className=\"btn btn-primary\"\r\n            style={{ width: '100%', padding: '0.7rem' }}\r\n          >\r\n            {isSubmitting ? 'Creating Account...' : 'Complete Registration'}\r\n          </button>\r\
