  setTimeout(() => setCopiedId(null), 2000);\r\n  };\r\n\r\n  const handleDelete = async (id) => {\r\n    if (!window.confirm('Are you sure you want to delete this short link? All click analytics will be permanently removed.')) {\r\n      return;\r\n    }\r\n\r\n    try {\r\n      await api.deleteLink(id);\r\n      setLinks(links.filter((l) => l._id !== id));\r\n    } catch (err) {\r\n      alert(err.message || 'Failed to delete link');\r\n    }\r\n  };\r\n\r\n  const totalClicks = links.reduce((sum, link) => sum + (link.clicksCount || 0), 0);\r\n  const activeLinks = links.filter((link) => !link.isBlocked && !link.isExpired).length;\r\n\r\n  return (\r\n    <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem' }}>\r\n      {/* Welcome & Action Header */}\r\n      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>\r\n        <div>\r\n          <h1 style={{ fontSize: '1.75rem' }}>Dashboard</h1>\r\n          <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', marginTop: '0.2rem' }}>\r\n            Welcome back, <strong>{user?.name}</strong>. Manage your links and inspect traffic analytics.\r\n          </p>\r\n        </div>\r\n\r\n        <button onClick={() => setIsCreateOpen(true)} className=\"btn btn-primary\">\r\n          <IconPlus size={16} />\r\n          Create Short Link\r\n        </button>\r\n      </div>\r\n\r\n      {/* Metric Cards Grid */}\r\n      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '1rem' }}>\r\n        <div className=\"card\" style={{ padding: '1.25rem' }}>\r\n          <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>\r\n            Total Links Created\r\n          </span>\r\n          <div style={{ fontSize: '1.75rem', fontWeight: 700, marginTop: '0.35rem' }}>\r\n            {links.length}\r\n          </div>\r\n        </div>\r\n\r\n        <div className=\"card\" style={{ padding: '1.25rem' }}>\r\n          <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>\r\n            Total Clicks Gathered\r\n          </span>\r\n          <div style={{ fontSize: '1.75rem', fontWeight: 700, marginTop: '0.35rem', color: 'var(--accent)' }}>\r\n            {totalClicks}\r\n          </div>\r\n        </div>\r\n\r\n        <div className=\"card\" style={{ padding: '1.25rem' }}>\r\n          <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>\r\n            Active / Operational\r\n          </span>\r\n          <div style={{ fontSize: '1.75rem', fontWeight: 700, marginTop: '0.35rem', color: 'var(--success)' }}>\r\n            {activeLinks}\r\n          </div>\r\n        </div>\r\n      </div>\r\n\r\n      {/* Search & Links Table */}\r\n      <div className=\"card\" style={{ padding: '1.25rem', display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>\r\n        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>\r\n          <h3 style={{ fontSize: '1.1rem' }}>Your Short Links</h3>\r\n\r\n          <div style={{ position: 'relative', width: '280px' }}>\r\n            <span style={{ position: 'absolute', left: '10px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)' }}>\r\n              <IconSearch size={14} />\r\n            </span>\r\n            <input\r\n              type=\"text\"\r\n              className=\"form-input\"\r\n              placeholder=\"Search by code, alias, or URL...\"\r\n              value={search}\r\n              onChange={(e) => setSearch(e.target.value)}\r\n              style={{ paddingLeft: '32px', fontSize: '0.8125rem' }}\r\n            />\r\n          </div>\r\n        </div>\r\n\r\n        {error && <div className=\"alert alert-danger\">{error}</div>}\r\n\r\n        {loading ? (\r\n          <div style={{ textAlign: 'center', padding: '3rem 0', color: 'var(--text-secondary)' }}>\r\n            Loading short links...\r\n          </div>\r\n        ) : links.length === 0 ? (\r\n          <div style={{ textAlign: 'center', padding: '3.5rem 1rem' }}>\r\n            <div\r\n              style={{\r\n                width: '48px',\r\n                height: '48px',\r\n                borderRadius: 'var(--radius-full)',\r\n                backgroundColor: 'var(--bg-card)',\r\n                display: 'inline-flex',\r\n                alignItems: 'center',\r\n                justifyContent: 'center',\r\n                color: 'var(--text-muted)',\r\n                marginBottom: '1rem',\r\n              }}\r\n            >\r\n              <IconLink size={24} />\r\n            </div>\r\n            <h4>No Short Links Found</h4>\r\n            <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', maxWidth: '360px', margin: '0.4rem auto 1.25rem' }}>\r\n              {search\r\n                ? 'No links match your search query. Try clearing the search filter.'\r\n                : 'You have not created any short links yet. Shorten your first URL to start gathering analytics.'}\r\n            </p>\r\n            {!search && (\r\n              <button onClick={() => setIsCreateOpen(true)} className=\"btn btn-primary btn-sm\">\r\n                <IconPlus size={14} />\r\n                Create First Link\r\n              </button>\r\n            )}\r\n          </div>\r\n        ) : (\r\n          <div className=\"table-wrapper\">\r\n            <table className=\"data-table\">\r\n              <thead>\r\n                <tr>\r\n                  <th>Short URL & Alias</th>\r\n                  <th>Destination Target</th>\r\n                  <th>Clicks</th>\r\n                  <th>Status</th>\r\n                  <th>Expiration</th>\r\n                  <th style={{ textAlign: 'right' }}>Actions</th>\r\n                </tr>\r\n              </thead>\r\n              <tbody>\r\n                {links.map((link) => (\r\n                  <tr key={link._id}>\r\n                    <td>\r\n                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>\r\n                        <code style={{ fontSize: '0.875rem', color: 'var(--accent)', fontWeight: 600 }}>\r\n                          /{link.shortCode}\r\n                        </code>\r\n                        <button\r\n                          onClick={() => handleCopy(link._id, link.shortUrl)}\r\n                          className=\"btn btn-icon btn-sm\"\r\n                          title=\"Copy short link\"\r\n                        >\r\n                          {copiedId === link._id ? (\r\n                            <IconCheck size={13} style={{ color: 'var(--success)' }} />\r\n                          ) : (\r\n                            <IconCopy size={13} />\r\n                          )}\r\n                        </button>\r\n                      </div>\r\n                      {link.alias && (\r\n                        <span style={{ fontSize: '0.725rem', color: 'var(--text-muted)' }}>\r\n                          Alias: {link.alias}\r\n                        </span>\r\n                      )}\r\n                    </td>\r\n\r\n                    <td>\r\n                      <div\r\n                        style={{\r\n                          maxWidth: '260px',\r\n                          overflow: 'hidden',\r\n                          textOverflow: 'ellipsis',\r\n                          whiteSpace: 'nowrap',\r\n                          fontSize: '0.8125rem',\r\n                        }}\r\n                        title={link.originalUrl}\r\n                      >\r\n                        {link.originalUrl}\r\n                      </div>\r\n                    </td>\r\n\r\n                    <td>\r\n                      <span\r\n                        style={{\r\n                          fontFamily: 'var(--font-mono)',\r\n                          fontWeight: 600,\r\n                          fontSize: '0.85rem',\r\n                          background: 'var(--bg-app)',\r\n                          padding: '0.2rem 0.5rem',\r\n                          borderRadius: 'var(--radius-sm)',\r\n                          border: '1px solid var(--border-subtle)',\r\n                        }}\r\n                      >\r\n                        {link.clicksCount}\r\n                      </span>\r\n                    </td>\r\n\r\n                    <td>\r\n                      {link.isBlocked ? (\r\n                        <span className=\"badge badge-blocked\" title={link.blockReason}>\r\n                          Blocked\r\n                        </span>\r\n                      ) : link.isExpired ? (\r\n                        <span className=\"badge badge-expired\">Expired</span>\r\n                      ) : (\r\n                        <span className=\"badge badge-active\">Active</span>\r\n                      )}\r\n                    </td>\r\n\r\n                    <td>\r\n                      {link.expiresAt ? (\r\n                        <span style={{ fontSize: '0.775rem', color: link.isExpired ? 'var(--warning)' : 'var(--text-secondary)', display: 'flex', alignItems: 'center', gap: '0.3rem' }}>\r\n                          <IconClock size={12} />\r\n                          {new Date(link.expiresAt).toLocaleDateString()}\r\n                        </span>\r\n                      ) : (\r\n                        <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Never</span>\r\n                      )}\r\n                    </td>\r\n\r\n                    <td style={{ textAlign: 'right' }}>\r\n                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: '0.4rem' }}>\r\n                        <button\r\n                          onClick={() => setSelectedAnalyticsId(link._id)}\r\n                          className=\"btn btn-secondary btn-sm\"\r\n                          title=\"View Aggregation Analytics\"\r\n                        >\r\n                          <IconBarChart size={14} style={{ color: 'var(--accent)' }} />\r\n                          Analytics\r\n                        </button>\r\n\r\n                        <a\r\n                          href={link.shortUrl}\r\n                          target=\"_blank\"\r\n                          rel=\"noopener noreferrer\"\r\n                          className=\"btn btn-icon btn-sm\"\r\n                          title=\"Test Redirect\"\r\n                        >\r\n                          <IconExternalLink size={14} />\r\n                        </a>\r\n\r\n                        <button\r\n                          onClick={() => handleDelete(link._id)}\r\n                          className=\"btn btn-icon btn-sm\"\r\n                          title=\"Delete Link\"\r\n                          style={{ color: 'var(--danger)' }}\r\n                        >\r\n                          <IconTrash size={14} />\r\n                        </button>\r\n                      </div>\r\n                    </td>\r\n                  </tr>\r\n                ))}\r\n              </tbody>\r\n            </table>\r\n          </div>\r\n        )}\r\n      </div>\r\n\r\n      {/* Modals */}\r\n      <CreateLinkModal\r\n        isOpen={isCreateOpen}\r\n        onClose={() => setIsCreateOpen(false)}\r\n        onLinkCreated={(newLink) => {\r\n          setLinks([newLink, ...links]);\r\n        }}\r\n      />\r\n\r\n      <AnalyticsModal\r\n        linkId={selectedAnalyticsId}\r\n        isOpen={!!selectedAnalyticsId}\r\n        onClose={() => setSelectedAnalyticsId(null)}\r\n      />\r\n    </div>\r\n  );\r\n};\r\n","lines":321},{"path":"client/src/pages/AdminDashboardPage.jsx","name":"AdminDashboardPage.jsx","category":"Frontend (React & Context API)","ext":"jsx","code":"import React, { useState, useEffect } from 'react';\r\nimport { api } from '../services/api';\r\nimport {\r\n  IconShield,\r\n  IconSearch,\r\n  IconExternalLink,\r\n  IconSmartphone,\r\n  IconLaptop,\r\n  IconTablet,\r\n  IconAlert,\r\n  IconCheck,\r\n} from '../components/Icons';\r\n\r\nexport const AdminDashboardPage = () => {\r\n  const [links, setLinks] = useState([]);\r\n  const [users, setUsers] = useState([]);\r\n  const [stats, setStats] = useState(null);\r\n  const [loading, setLoading] = useState(true);\r\n  const [error, setError] = useState('');\r\n  const [search, setSearch] = useState('');\r\n  const [statusFilter, setStatusFilter] = useState('');\r\n\r\n  const [blockingId, setBlockingId] = useState(null);\r\n  const [blockReason, setBlockReason] = useState('');\r\n  const [isUpdatingStatus, setIsUpdatingStatus] = useState(false);\r\n\r\n  useEffect(() => {\r\n    loadAdminData();\r\n  }, [search, statusFilter]);\r\n\r\n  const loadAdminData = async () => {\r\n    try {\r\n      setLoading(true);\r\n      setError('');\r\n      const [linksRes, usersRes, statsRes] = await Promise.all([\r\n        api.getAdminLinks({ search, status: statusFilter }),\r\n        api.getAdminUsers(),\r\n        api.getAdminStats(),\r\n      ]);\r\n      setLinks(linksRes.links || []);\r\n      setUsers(usersRes.users || []);\r\n      setStats(statsRes.stats || null);\r\n    } catch (err) {\r\n      setError(err.message || 'Failed to load administrative data');\r\n    } finally {\r\n      setLoading(false);\r\n    }\r\n  };\r\n\r\n  const handleToggleBlock = async (link) => {\r\n    if (link.isBlocked) {\r\n      if (!window.confirm(`Unblock link /${link.shortCode}?`)) return;\r\n      try {\r\n        await api.updateLinkStatus(link._id, { isBlocked: false, blockReason: '' });\r\n        loadAdminData();\r\n      } catch (err) {\r\n        alert(err.message || 'Failed to unblock link');\r\n      }\r\n    } else {\r\n      setBlockingId(link._id);\r\n      setBlockReason('Phishing, malware, or inappropriate destination URL');\r\n    }\r\n  };\r\n\r\n  const submitBlock = async () => {\r\n    if (!blockingId) return;\r\n    try {\r\n      setIsUpdatingStatus(true);\r\n      await api.updateLinkStatus(blockingId, {\r\n        isBlocked: true,\r\n        blockReason: blockReason.trim() || 'Suspended by admin',\r\n      });\r\n      setBlockingId(null);\r\n      setBlockReason('');\r\n      loadAdminData();\r\n    } catch (err) {\r\n      alert(err.message || 'Failed to block link');\r\n    } finally {\r\n      setIsUpdatingStatus(false);\r\n    }\r\n  };\r\n\r\n  return (\r\n    <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem' }}>\r\n      {/* Admin Title */}\r\n      <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>\r\n        <div style={{ background: 'rgba(168, 85, 247, 0.15)', color: '#c084fc', padding: '0.6rem', borderRadius: 'var(--radius-sm)' }}>\r\n          <IconShield size={24} />\r\n        </div>\r\n        <div>\r\n          <h1 style={{ fontSize: '1.75rem' }}>RBAC Administration Panel</h1>\r\n          <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', marginTop: '0.2rem' }}>\r\n            System-wide link moderation, user directories, and platform aggregation metrics.\r\n          </p>\r\n        </div>\r\n      </div>\r\n\r\n      {error && <div className=\"alert alert-danger\">{error}</div>}\r\n\r\n      {/* Platform-Wide Aggregations & Metrics */}\r\n      {stats && (\r\n        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem' }}>\r\n          <div className=\"card\" style={{ padding: '1.25rem' }}>\r\n            <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>\r\n              Platform Users\r\n            </span>\r\n            <div style={{ fontSize: '1.75rem', fontWeight: 700, marginTop: '0.35rem' }}>\r\n              {stats.totalUsers}\r\n            </div>\r\n          </div>\r\n\r\n          <div className=\"card\" style={{ padding: '1.25rem' }}>\r\n            <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>\r\n              Total Short Links\r\n            </span>\r\n            <div style={{ fontSize: '1.75rem', fontWeight: 700, marginTop: '0.35rem' }}>\r\n              {stats.totalLinks}\r\n            </div>\r\n          </div>\r\n\r\n          <div className=\"card\" style={{ padding: '1.25rem' }}>\r\n            <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>\r\n              Blocked Links\r\n            </span>\r\n            <div style={{ fontSize: '1.75rem', fontWeight: 700, marginTop: '0.35rem', color: 'var(--danger)' }}>\r\n              {stats.blockedLinks}\r\n            </div>\r\n          </div>\r\n\r\n          <div className=\"card\" style={{ padding: '1.25rem' }}>\r\n            <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>\r\n              Total System Clicks\r\n            </span>\r\n            <div style={{ fontSize: '1.75rem', fontWeight: 700, marginTop: '0.35rem', color: 'var(--accent)' }}>\r\n              {stats.totalClicks}\r\n            </div>\r\n          </div>\r\n        </div>\r\n      )}\r\n\r\n      {/* Aggregation Device Distribution Across All Links */}\r\n      {stats?.systemDeviceStats && stats.systemDeviceStats.length > 0 && (\r\n        <div className=\"card\">\r\n          <h4 style={{ fontSize: '0.95rem', marginBottom: '0.85rem' }}>\r\n            System-Wide Device Breakdown (Platform Aggregation Pipeline)\r\n          </h4>\r\n          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '1rem' }}>\r\n            {stats.systemDeviceStats.map((item) => (\r\n              <div\r\n                key={item.device}\r\n                style={{\r\n                  background: 'var(--bg-app)',\r\n                  border: '1px solid var(--border-subtle)',\r\n                  borderRadius: 'var(--radius-sm)',\r\n                  padding: '0.85rem',\r\n                }}\r\n              >\r\n                <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>{item.device}</div>\r\n                <div style={{ fontSize: '1.4rem', fontWeight: 700, marginTop: '0.2rem', fontFamily: 'var(--font-mono)' }}>\r\n                  {item.clicks} <span style={{ fontSize: '0.8rem', fontWeight: 400, color: 'var(--text-muted)' }}>clicks</span>\r\n                </div>\r\n              </div>\r\n            ))}\r\n          </div>\r\n        </div>\r\n      )}\r\n\r\n      {/* Global Links Moderation Table */}\r\n      <div className=\"card\" style={{ display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>\r\n        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>\r\n          <h3 style={{ fontSize: '1.1rem' }}>All Platform Links</h3>\r\n\r\n          <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap' }}>\r\n            <select\r\n              className=\"form-select\"\r\n              value={statusFilter}\r\n              onChange={(e) => setStatusFilter(e.target.value)}\r\n              style={{ width: '140px', fontSize: '0.8125rem' }}\r\n            >\r\n              <option value=\"\">All Statuses</option>\r\n              <option value=\"active\">Active Only</option>\r\n              <option value=\"blocked\">Blocked Only</option>\r\n            </select>\r\n\r\n            <div style={{ position: 'relative', width: '240px' }}>\r\n              <span style={{ position: 'absolute', left: '10px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)' }}>\r\n                <IconSearch size={14} />\r\n              </span>\r\n              <input\r\n                type=\"text\"\r\n                className=\"form-input\"\r\n                placeholder=\"Filter links...\"\r\n                value={search}\r\n                onChange={(e) => setSearch(e.target.value)}\r\n                style={{ paddingLeft: '32px', fontSize: '0.8125rem' }}\r\n              />\r\n            </div>\r\n          </div>\r\n        </div>\r\n\r\n        {loading ? (\r\n          <div style={{ textAlign: 'center', padding: '2rem 0', color: 'var(--text-secondary)' }}>\r\n            Loading platform records...\r\n          </div>\r\n        ) : links.length === 0 ? (\r\n          <div style={{ textAlign: 'center', padding: '2rem 0', color: 'var(--text-muted)' }}>\r\n            No links match filter criteria.\r\n          </div>\r\n        ) : (\r\n          <div className=\"table-wrapper\">\r\n            <table className=\"data-table\">\r\n              <thead>\r\n                <tr>\r\n                  <th>Short Code</th>\r\n                  <th>Owner</th>\r\n                  <th>Target Destination</th>\r\n                  <th>Clicks</th>\r\n                  <th>Status</th>\r\n                  <th style={{ textAlign: 'right' }}>Moderation Action</th>\r\n                </tr>\r\n              </thead>\r\n              <tbody>\r\n                {links.map((link) => (\r\n                  <tr key={link._id}>\r\n                    <td>\r\n                      <code style={{ fontSize: '0.85rem', color: 'var(--accent)', fontWeight: 600 }}>\r\n                        /{link.shortCode}\r\n                      </code>\r\n                    </td>\r\n                    <td>\r\n                      <div style={{ fontSize: '0.8125rem', fontWeight: 500 }}>\r\n                        {link.createdBy?.name || 'Unknown User'}\r\n                      </div>\r\n                      <div style={{ fontSize: '0.725rem', color: 'var(--text-muted)' }}>\r\n                        {link.createdBy?.email}\r\n                      </div>\r\n                    </td>\r\n                    <td>\r\n                      <div\r\n                        style={{\r\n                          maxWidth: '220px',\r\n                          overflow: 'hidden',\r\n                          textOverflow: 'ellipsis',\r\n                          whiteSpace: 'nowrap',\r\n                          fontSize: '0.8rem',\r\n                        }}\r\n                      >\r\n                        {link.originalUrl}\r\n                      </div>\r\n                    </td>\r\n                    <td style={{ fontFamily: 'var(--font-mono)' }}>{link.clicksCount}</td>\r\n                    <td>\r\n                      {link.isBlocked ? (\r\n                        <span className=\"badge badge-blocked\" title={link.blockReason}>\r\n                          Blocked\r\n                        </span>\r\n                      ) : (\r\n                        <span className=\"badge badge-active\">Active</span>\r\n                      )}\r\n                    </td>\r\n                    <td style={{ textAlign: 'right' }}>\r\n                      <button\r\n                        onClick={() => handleToggleBlock(link)}\r\n                        className={`btn btn-sm ${link.isBlocked ? 'btn-secondary' : 'btn-danger'}`}\r\n                      >\r\n                        {link.isBlocked ? 'Unblock Link' : 'Block Link'}\r\n                      </button>\r\n                    </td>\r\n                  </tr>\r\n                ))}\r\n              </tbody>\r\n            </table>\r\n          </div>\r\n        )}\r\n      </div>\r\n\r\n      {/* Users Overview Directory */}\r\n      <div className=\"card\">\r\n        <h3 style={{ fontSize: '1.1rem', marginBottom: '1rem' }}>Registered Users Directory</h3>\r\n        <div className=\"table-wrapper\">\r\n          <table className=\"data-table\">\r\n            <thead>\r\n              <tr>\r\n                <th>Name</th>\r\n                <th>Email</th>\r\n                <th>Role</th>\r\n                <th>Total Links</th>\r\n                <th>Total Clicks</th>\r\n                <th>Joined</th>\r\n              </tr>\r\n            </thead>\r\n            <tbody>\r\n              {users.map((u) => (\r\n                <tr key={u._id}>\r\n                  <td style={{ fontWeight: 500 }}>{u.name}</td>\r\n                  <td style={{ color: 'var(--text-secondary)' }}>{u.email}</td>\r\n                  <td>\r\n                    <span className={`badge ${u.role === 'admin' ? 'badge-role-admin' : 'badge-role-user'}`}>\r\n                      {u.role}\r\n                    </span>\r\n                  </td>\r\n                  <td style={{ fontFamily: 'var(--font-mono)' }}>{u.totalLinks}</td>\r\n                  <td style={{ fontFamily: 'var(--font-mono)' }}>{u.totalClicks}</td>\r\n                  <td style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>\r\n                    {new Date(u.createdAt).toLocaleDateString()}\r\n                  </td>\r\n                </tr>\r\n              ))}\r\n            </tbody>\r\n          </table>\r\n        </div>\r\n      </div>\r\n\r\n      {/* Block Reason Modal */}\r\n      {blockingId && (\r\n        <div className=\"modal-overlay\" onClick={() => setBlockingId(null)}>\r\n          <div className=\"modal-content\" onClick={(e) => e.stopPropagation()}>\r\n            <div className=\"modal-header\">\r\n              <h3>Block Abusive Short Link</h3>\r\n              <button onClick={() => setBlockingId(null)} className=\"btn btn-icon\">\r\n                &times;\r\n              </button>\r\n            </div>\r\n            <div className=\"modal-body\">\r\n              <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', marginBottom: '1rem' }}>\r\n                Specify why this short link is being suspended. Visitors will see this notice if they attempt to access it.\r\n              </p>\r\n              <div className=\"form-group\">\r\n                <label className=\"form-label\">Block Reason</label>\r\n                <textarea\r\n                  className=\"form-input\"\r\n                  rows={3}\r\n                  value={blockReason}\r\n                  onChange={(e) => setBlockReason(e.target.value)}\r\n                  placeholder=\"e.g. Malicious URL, spam, or phishing\"\r\n                />\r\n              </div>\r\n            </div>\r\n            <div className=\"modal-footer\">\r\n              <button onClick={() => setBlockingId(null)} className=\"btn btn-secondary\">\r\n                Cancel\r\n              </button>\r\n              <button\r\n                onClick={submitBlock}\r\n                disabled={isUpdatingStatus}\r\n                className=\"btn btn-danger\"\r\n              >\r\n                {isUpdatingStatus ? 'Suspending...' : 'Confirm Suspension'}\r\n              </button>\r\n            </div>\r\n          </div>\r\n        </div>\r\n      )}\r\n    </div>\r\n  );\r\n};\r\n","lines":357},{"path":"client/src/index.css","name":"index.css","category":"Frontend (React & Context API)","ext":"css","code":"\r\n:root {\r\n  --bg-app: #09090b;\r\n  --bg-surface: #101014;\r\n  --bg-card: #18181b;\r\n  --bg-card-hover: #1f1f23;\r\n  --bg-input: #121216;\r\n  \r\n  --border-subtle: #27272a;\r\n  --border-strong: #3f3f46;\r\n  --border-focus: #38bdf8;\r\n  \r\n  --text-primary: #f4f4f5;\r\n  --text-secondary: #a1a1aa;\r\n  --text-muted: #71717a;\r\n  \r\n  --accent: #38bdf8;\r\n  --accent-hover: #0284c7;\r\n  --accent-soft: rgba(56, 189, 248, 0.12);\r\n  \r\n  --danger: #ef4444;\r\n  --danger-soft: rgba(239, 68, 68, 0.12);\r\n  --success: #10b981;\r\n  --success-soft: rgba(16, 185, 129, 0.12);\r\n  --warning: #f59e0b;\r\n  --warning-soft: rgba(245, 158, 11, 0.12);\r\n\r\n  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\r\n  --font-mono: 'JetBr ge-expired {\r\n  background-color: var(--warning-soft);\r\n  color: var(--warning);\r\n  border: 1px solid rgba(245, 158, 11, 0.3);\r\n}\r\n\r\n.badge-role-admin {\r\n  background-color: rgba(168, 85, 247, 0.15);\r\n  color: #c084fc;\r\n  border: 1px solid rgba(168, 85, 247, 0.3);\r\n}\r\n\r\n.badge-role-user {\r\n  background-color: rgba(56, 189, 248, 0.12);\r\n  color: #38bdf8;\r\n  border: 1px solid rgba(56, 189, 248, 0.25);\r\n}\r\n\r\n.modal-overlay {\r\n  position: fixed;\r\n  inset: 0;\r\n  background-color: rgba(0, 0, 0, 0.75);\r\n  backdrop-filter: blur(4px);\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  padding: 1.5rem;\r\n  z-index: 1000;\r\n}\r\n\r\n.modal-content {\r\n  background-color: var(--bg-surface);\r\n  border: 1px solid var(--border-subtle);\r\n  border-radius: var(--radius-lg);\r\n  max-width: 580px;\r\n  width: 100%;\r\n  box-shadow: var(--shadow-lg);\r\n  display: flex;\r\n  flex-direction: column;\r\n  max-height: 90vh;\r\n  overflow: hidden;\r\n  animation: modalIn 0.15s ease-out;\r\n}\r\n\r\n.modal-content.wide {\r\n  max-width: 820px;\r\n}\r\n\r\n@keyframes modalIn {\r\n  from { opacity: 0; transform: scale(0.97); }\r\n  to { opacity: 1; transform: scale(1); }\r\n}\r\n\r\n.modal-header {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  padding: 1.25rem 1.5rem;\r\n  border-bottom: 1px solid var(--border-subtle);\r\n}\r\n\r\n.modal-body {\r\n  padding: 1.5rem;\r\n  overflow-y: auto;\r\n}\r\n\r\n.modal-footer {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: flex-end;\r\n  gap: 0.75rem;\r\n  padding: 1rem 1.5rem;\r\n  border-top: 1px solid var(--border-subtle);\r\n  background-color: rgba(24, 24, 27, 0.5);\r\n}\r\n\r\n.card {\r\n  background-color: var(--bg-surface);\r\n  border: 1px solid var(--border-subtle);\r\n  border-radius: var(--radius-md);\r\n  padding: 1.5rem;\r\n}\r\n\r\n.alert {\r\n  padding: 0.75rem 1rem;\r\n  border-radius: var(--radius-sm);\r\n  font-size: 0.85rem;\r\n  margin-bottom: 1.25rem;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 0.6rem;\r\n}\r\n\r\n.alert-danger {\r\n  background-color: var(--danger-soft);\r\n  color: #f87171;\r\n  border: 1px solid rgba(239, 68, 68, 0.3);\r\n}\r\n\r\n.alert-success {\r\n  background-color: var(--success-soft);\r\n  color: #34d399;\r\n  border: 1px solid rgba(16, 185, 129, 0.3);\r\n}\r\n\r\n.table-wrapper {\r\n  overflow-x: auto;\r\n  border: 1px solid var(--border-subtle);\r\n  border-radius: var(--radius-md);\r\n}\r\n\r\n.data-table {\r\n  width: 100%;\r\n  border-collapse: collapse;\r\n  text-align: left;\r\n  font-size: 0.875rem;\r\n}\r\n\r\n.data-table th {\r\n  background-color: var(--bg-card);\r\n  padding: 0.85rem 1rem;\r\n  font-weight: 500;\r\n  color: var(--text-secondary);\r\n  border-bottom: 1px solid var(--border-subtle);\r\n  font-size: 0.775rem;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.05em;\r\n}\r\n\r\n.data-table td {\r\n  padding: 0.85rem 1rem;\r\n  border-bottom: 1px solid var(--border-subtle);\r\n  color: var(--text-primary);\r\n  vertical-align: middle;\r\n}\r\n\r\n.data-table tr:last-child td {\r\n  border-bottom: none;\r\n}\r\n\r\n.data-table tr:hover td {\r\n  background-color: var(--bg-card-hover);\r\n}\r\n\r\n@media (max-width: 768px) {\r\n  .main-content {\r\n    padding: 1.25rem 1rem 3rem;\r\n  }\r\n}\r\n","lines":362}];
    let currentIndex = 0;
    let isPlaying = false;
    let scrollInterval = null;

    const sidebar = document.getElementById('sidebar');
    const codeBlock = document.getElementById('codeBlock');
    const scrollContainer = document.getElementById('scrollContainer');
    const currentCategory = document.getElementById('currentCategory');
    const currentPath = document.getElementById('currentPath');
    const lineCount = document.getElementById('lineCount');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const speedSelect = document.getElementById('speedSelect');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function renderSidebar() {
      sidebar.innerHTML = '';
      let currentCat = '';
      files.forEach((file, idx) => {
        if (file.category !== currentCat) {
          currentCat = file.category;
          const catEl = document.createElement('div');
          catEl.className = 'category-title';
          catEl.textContent = currentCat;
          sidebar.appendChild(catEl);
        }
        const pill = document.createElement('div');
        pill.className = 'file-pill' + (idx === currentIndex ? ' active' : '');
        pill.innerHTML = '<span>' + file.name + '</span><span style="font-size: 0.7rem; opacity: 0.6;">' + file.lines + 'L</span>';
        pill.onclick = () => { selectFile(idx); };
        sidebar.appendChild(pill);
      });
    }

    function selectFile(index) {
      currentIndex = index;
      const file = files[currentIndex];
      currentCategory.textContent = file.category;
      currentPath.textContent = file.path;
      lineCount.textContent = file.lines + ' lines &bull; Cleaned (0 comments)';
      codeBlock.textContent = file.code;
      codeBlock.className = 'language-' + (file.ext === 'jsx' ? 'jsx' : file.ext === 'css' ? 'css' : 'javascript');
      Prism.highlightElement(codeBlock);
      scrollContainer.scrollTop = 0;
      progressFill.style.width = Math.round(((currentIndex + 1) / files.length) * 100) + '%';
      renderSidebar();
    }

    function nextFile() {
      if (currentIndex < files.length - 1) {
        selectFile(currentIndex + 1);
      } else {
        stopPlay();
      }
    }

    function prevFile() {
      if (currentIndex > 0) {
        selectFile(currentIndex - 1);
      }
    }

    function getSpeedInterval() {
      const speed = speedSelect.value;
      if (speed === 'fast') return 20;
      if (speed === 'slow') return 60;
      return 35; // normal
    }

    function startPlay() {
      isPlaying = true;
      playBtn.textContent = '⏸ Pause Walkthrough';
      playBtn.style.background = '#eab308';
      playBtn.style.color = '#000';

      const intervalMs = getSpeedInterval();
      scrollInterval = setInterval(() => {
        if (!isPlaying) return;
        const maxScroll = scrollContainer.scrollHeight - scrollContainer.clientHeight;
        if (scrollContainer.scrollTop < maxScroll - 2) {
          scrollContainer.scrollTop += 1.5;
        } else {
          // Reached bottom of current file, wait 1.2s and go to next file
          clearInterval(scrollInterval);
          setTimeout(() => {
            if (isPlaying) {
              if (currentIndex < files.length - 1) {
                nextFile();
                startPlay();
              } else {
                stopPlay();
              }
            }
          }, 1200);
        }
      }, intervalMs);
    }

    function stopPlay() {
      isPlaying = false;
      playBtn.innerHTML = '&#9658; Play Walkthrough';
      playBtn.style.background = 'var(--accent)';
      playBtn.style.color = '#09090b';
      if (scrollInterval) clearInterval(scrollInterval);
    }

    playBtn.onclick = () => {
      if (isPlaying) stopPlay();
      else startPlay();
    };

    nextBtn.onclick = () => { stopPlay(); nextFile(); };
    prevBtn.onclick = () => { stopPlay(); prevFile(); };
    fullscreenBtn.onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    selectFile(0);
  </script>
</body>
</html>
